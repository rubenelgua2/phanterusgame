<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070304">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>phanteru's daemon</title>
<style>
  :root {
    --px: 3px;     /* tamaño de un "píxel" de la interfaz (lo ajusta el script, siempre entero) */
    --tpx: 3px;    /* tamaño de un píxel del título */
    --blood: #d10a0a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; width: 100%; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;                         /* sin scroll ni "rebote" en móvil */
    background: #070304; overflow: hidden; font-family: monospace;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

  #menu {
    position: relative;
    width: 100%; height: 100%; height: 100dvh;      /* dvh: respeta la barra del navegador móvil */
    display: flex; flex-direction: column;
    align-items: center;           /* centrado horizontal */
    justify-content: flex-start;   /* parte superior */
    padding-top: calc(5vh + env(safe-area-inset-top));
    overflow: hidden;
  }
  [data-layout=portrait] #menu { padding-top: calc(3dvh + env(safe-area-inset-top)); }

  /* ESCENA (detrás del título) */
  #scene {                                  /* el script fija tamaño y posición según el dispositivo */
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%; max-width: none;
    z-index: 0;
  }
  #scene { transform-origin: 0 0; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }   /* zoom a la máquina al jugar */
  /* si la escena no llega a un borde de la pantalla, se funde con el negro por ese lado */
  #scene.fade-y {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
  }
  #scene.fade-x {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
  }
  #scene.fade-x.fade-y {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 55%, transparent 38%, rgba(0,0,0,.88) 100%);
  }

  /* TÍTULO pixel art */
  .title { position: relative; z-index: 10; line-height: 0; font-size: 0; user-select: none; }
  #titleCanvas { display: block; }

  /* BOTONES pixel art (cada botón contiene dos canvas: normal y resaltado)
     Siempre centrados bajo la máquina; la altura exacta la fija el script (composición centrada) */
  .menu-buttons {
    position: absolute; z-index: 10;
    left: 50%; bottom: calc(4vh + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: calc(var(--px) * 4);
    width: max-content; max-width: 96vw;
  }
  /* móvil en vertical: botones en columna, fáciles de pulsar con el pulgar */
  [data-layout=portrait] .menu-buttons {
    flex-direction: column; align-items: center; flex-wrap: nowrap;
    bottom: calc(3dvh + env(safe-area-inset-bottom)); gap: calc(var(--px) * 3);
  }
  /* MINIJUEGO de la slot: fuera título y botones (en móvil tapaban las monedas), solo queda VOLVER en la esquina */
  .title, .menu-buttons, .slot-exit { transition: opacity .35s, visibility .35s; }
  #menu.slot-play .title, #menu.slot-play .menu-buttons { opacity: 0; visibility: hidden; }
  .slot-exit {
    position: absolute; z-index: 12; opacity: 0; visibility: hidden;
    top: calc(var(--px) * 4 + env(safe-area-inset-top)); right: calc(var(--px) * 4 + env(safe-area-inset-right));
  }
  #menu.slot-play .slot-exit { opacity: 1; visibility: visible; }

  .btn {
    background: none; border: 0; padding: 0; margin: 0;
    line-height: 0; font-size: 0; cursor: pointer;
    display: inline-block;
  }
  .btn canvas { display: block; }
  .btn .h { display: none; }
  .btn:focus-visible .n, .btn:active .n { display: none; }
  .btn:focus-visible .h, .btn:active .h { display: block; }
  @media (hover: hover) { .btn:hover .n { display: none; } .btn:hover .h { display: block; } }
  .btn:focus { outline: none; }
  .btn:active { transform: translateY(var(--px)); }

  /* texto pixel art genérico */
  .px { display: block; height: auto; max-width: 100%; margin: 0 auto; }

  /* VENTANAS */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .74);
    padding: max(4vw, env(safe-area-inset-top)) max(4vw, env(safe-area-inset-right)) max(4vw, env(safe-area-inset-bottom)) max(4vw, env(safe-area-inset-left));
    overflow-y: auto;
  }
  .overlay.open { display: flex; animation: fadein .2s steps(4, end); }
  .overlay.solid { background: #000; flex-direction: column; text-align: center; gap: calc(var(--px) * 6); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .panel {
    width: min(92vw, calc(var(--px) * 150)); margin: auto;
    background: #0d0405;
    border: calc(var(--px) * 2) solid #5a0000;
    box-shadow: inset 0 0 0 var(--px) #1a0507;
    padding: calc(var(--px) * 7) calc(var(--px) * 8) calc(var(--px) * 8);
    text-align: center;
    /* esquinas "escalonadas" estilo pixel art */
    clip-path: polygon(
      var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
      100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%,
      var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px));
  }
  .panel h2 { margin-bottom: calc(var(--px) * 6); line-height: 0; font-size: 0; }
  .row-actions { display: flex; justify-content: center; gap: calc(var(--px) * 4); margin-top: calc(var(--px) * 7); flex-wrap: wrap; }
  .vol-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: calc(var(--px) * 3); line-height: 0; font-size: 0; }
  .vol-label .px { margin: 0; }
  .vol-row { display: flex; align-items: center; gap: calc(var(--px) * 3); }
  .warn-lines { display: flex; flex-direction: column; align-items: center; gap: calc(var(--px) * 2); line-height: 0; font-size: 0; }

  /* slider */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; min-width: 0; height: calc(var(--px) * 8);
    background: transparent; cursor: pointer; margin: 0; --pct: 70%;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    box-sizing: content-box; height: calc(var(--px) * 4); border: var(--px) solid #5a0000; border-radius: 0;
    background: linear-gradient(90deg, #d10a0a var(--pct), #1a0507 var(--pct));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; box-sizing: border-box;
    width: calc(var(--px) * 4); height: calc(var(--px) * 8); margin-top: calc(var(--px) * -2);
    background: #ff5a4a; border: var(--px) solid #070102; border-radius: 0;
  }
  input[type=range]::-moz-range-track { height: calc(var(--px) * 4); border: var(--px) solid #5a0000; border-radius: 0; background: #1a0507; }
  input[type=range]::-moz-range-progress { height: calc(var(--px) * 4); background: #d10a0a; }
  input[type=range]::-moz-range-thumb {
    box-sizing: border-box; width: calc(var(--px) * 4); height: calc(var(--px) * 8);
    background: #ff5a4a; border: var(--px) solid #070102; border-radius: 0;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { background: #fff; }
  input[type=range]:focus-visible::-moz-range-thumb { background: #fff; }
  @media (pointer: coarse) {                      /* deslizador más grande para el dedo */
    input[type=range] { height: calc(var(--px) * 14); }
    input[type=range]::-webkit-slider-thumb { width: calc(var(--px) * 6); height: calc(var(--px) * 12); margin-top: calc(var(--px) * -4); }
    input[type=range]::-moz-range-thumb { width: calc(var(--px) * 6); height: calc(var(--px) * 12); }
  }

  /* INTRO (nueva partida) */
  #newgame { padding: 0; background: #000; }
  #settings { z-index: 60; }   /* ajustes por encima de la intro */
  #introCanvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  [data-layout=portrait] #introCanvas { top: 50%; height: auto; transform: translateY(-50%); object-fit: contain; }   /* formato cine en vertical */
  /* sala vista desde arriba: se ve entera siempre (sin recortes), con bandas negras si sobra pantalla */
  #roomCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; background: #000; touch-action: none; }
  .intro-top {
    position: absolute; z-index: 3; top: calc(var(--px) * 3 + env(safe-area-inset-top));
    right: calc(var(--px) * 3 + env(safe-area-inset-right));
    display: flex; gap: calc(var(--px) * 2); align-items: center;
  }
  .intro-icon-btn {
    background: rgba(0, 0, 0, .42); border: calc(var(--px) * 0.5) solid rgba(232, 224, 208, .28);
    padding: calc(var(--px) * 1.5); margin: 0; cursor: pointer; line-height: 0; font-size: 0;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .intro-icon-btn:focus { outline: none; }
  .intro-icon-btn:focus-visible { border-color: rgba(255, 90, 74, .7); }
  .intro-icon-btn:active { transform: translateY(1px); opacity: .85; }
  .intro-icon-btn canvas { display: block; width: calc(10 * var(--px)); height: calc(10 * var(--px)); }
  .intro-sub {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--px) * 16 + env(safe-area-inset-bottom)); z-index: 2;
    cursor: pointer; max-width: 96vw; background: none; border: 0; padding: 0; line-height: 0;
  }
  .intro-sub[hidden] { display: none !important; }
  .intro-hud-phone {
    position: absolute; z-index: 3;
    right: calc(var(--px) * 4 + env(safe-area-inset-right));
    bottom: calc(var(--px) * 4 + env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, .35); border: calc(var(--px) * 0.5) solid rgba(232, 224, 208, .22);
    padding: calc(var(--px) * 1.5); line-height: 0;
  }
  .intro-hud-phone canvas { display: block; width: calc(12 * var(--px)); height: calc(18 * var(--px)); }
  /* el móvil vibra: tiembla un momento y para, una y otra vez, hasta que se abre */
  .intro-hud-phone.buzzing { animation: hudbuzz 1.8s infinite; }
  @keyframes hudbuzz {
    0%, 22%, 100% { transform: none; }
    3% { transform: translateX(-2px) rotate(-8deg); } 6% { transform: translateX(2px) rotate(8deg); }
    9% { transform: translateX(-2px) rotate(-8deg); } 12% { transform: translateX(2px) rotate(8deg); }
    15% { transform: translateX(-1px) rotate(-5deg); } 18% { transform: translateX(1px) rotate(5deg); }
  }
  /* en el móvil la partida (intro y sala) obliga a ponerlo en horizontal: en vertical, aviso a pantalla completa */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--px) * 6);
    background: #000; text-align: center; padding: 0 6vw;
  }
  @media (orientation: portrait) and (pointer: coarse) { body:has(#newgame.open) #rotate { display: flex; } }
  .rotate-phone {
    width: calc(var(--px) * 14); height: calc(var(--px) * 24); margin-bottom: calc(var(--px) * 4);
    border: var(--px) solid #e8e0d0; border-radius: calc(var(--px) * 2); position: relative;
    animation: rotatephone 2.4s ease-in-out infinite;
  }
  .rotate-phone::after {                         /* botón de inicio */
    content: ''; position: absolute; left: 50%; bottom: calc(var(--px) * 1.5); transform: translateX(-50%);
    width: calc(var(--px) * 4); height: var(--px); background: #e8e0d0;
  }
  @keyframes rotatephone { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .rotate-phone { animation: none; transform: rotate(-90deg); } }
  /* joystick del móvil (sala): abajo a la izquierda, el pulgar arrastra la bola */
  .joystick {
    position: absolute; z-index: 3; touch-action: none;
    left: calc(var(--px) * 6 + env(safe-area-inset-left));
    bottom: calc(var(--px) * 6 + env(safe-area-inset-bottom));
    width: clamp(104px, calc(var(--px) * 34), 150px); aspect-ratio: 1; border-radius: 50%;   /* que quepa bien el pulgar */
    background: rgba(0, 0, 0, .35); border: calc(var(--px) * 0.5) solid rgba(232, 224, 208, .25);
    display: flex; align-items: center; justify-content: center;
  }
  .joy-knob {
    width: 42%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
    background: rgba(232, 224, 208, .55); border: calc(var(--px) * 0.5) solid rgba(255, 255, 255, .35);
  }
  .joystick.active { border-color: rgba(232, 224, 208, .45); }
  .joystick.active .joy-knob { background: rgba(232, 224, 208, .8); }
  /* ventana estática del smartphone (UI) */
  #phoneUI {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: calc(var(--px) * 4);
    background: rgba(0, 0, 0, .55);
    padding: max(3vw, env(safe-area-inset-top)) max(3vw, env(safe-area-inset-right)) max(3vw, env(safe-area-inset-bottom)) max(3vw, env(safe-area-inset-left));
  }
  #phoneUI.open { display: flex; animation: fadein .15s steps(3, end); }
  .phone-device {
    position: relative; line-height: 0;
    filter: drop-shadow(0 calc(var(--px) * 2) 0 rgba(0,0,0,.55)) drop-shadow(0 calc(var(--px) * 6) calc(var(--px) * 10) rgba(0,0,0,.45));
  }
  #phoneUICanvas {
    display: block;
    height: min(68dvh, calc(100dvh - 5rem), calc(240 * var(--px)));
    width: auto;
    aspect-ratio: 240 / 480;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: default;
  }
  /* Interruptor izquierdo del chasis → apagar móvil */
  .phone-side-btn {
    position: absolute; left: 0; top: 24%;
    width: calc(var(--px) * 3.5); height: calc(var(--px) * 12);
    padding: 0; margin: 0; cursor: pointer; z-index: 1;
    background: transparent; border: 0;
  }
  .phone-side-btn:focus { outline: none; }
  .phone-side-btn:focus-visible { outline: calc(var(--px) * 0.5) solid rgba(255, 90, 74, .7); outline-offset: calc(var(--px) * 0.5); }
  .phone-side-btn:active { filter: brightness(1.15); }

  @media (prefers-reduced-motion: reduce) { .overlay.open { animation: none; } #phoneUI.open { animation: none; } #scene { transition: none; } .intro-hud-phone.buzzing { animation: none; } }
</style>
</head>
<body>
  <main id="menu">
    <canvas id="scene" width="320" height="180"></canvas>
    <div class="vignette"></div>

    <h1 class="title"><canvas id="titleCanvas" role="img" aria-label="phanteru's daemon"></canvas></h1>

    <nav class="menu-buttons" id="menuButtons" aria-label="Menú principal">
      <!-- CONTINUAR solo aparece si hay una partida guardada -->
      <button class="btn" id="btnContinue" type="button" data-label="CONTINUAR" aria-label="Continuar partida" hidden></button>
      <button class="btn" id="btnNew" type="button" data-label="NUEVO JUEGO" aria-label="Nuevo juego"></button>
      <button class="btn" id="btnSettings" type="button" data-label="AJUSTES" aria-label="Ajustes"></button>
      <button class="btn" id="btnExit" type="button" data-label="SALIR" aria-label="Salir"></button>
    </nav>
    <button class="btn slot-exit" id="slotExit" type="button" data-label="VOLVER" aria-label="Dejar la tragaperras"></button>
  </main>

  <!-- Ajustes -->
  <div class="overlay" id="settings" role="dialog" aria-modal="true" aria-label="Ajustes">
    <div class="panel">
      <h2 data-px="AJUSTES" data-scale="2" data-color="#d10a0a"></h2>
      <div class="vol-label">
        <span data-px="VOLUMEN GENERAL" data-color="#c9b8b8"></span>
        <span id="volumeOut" data-px="70%" data-color="#ff5a4a"></span>
      </div>
      <div class="vol-row">
        <button class="btn" id="volDown" type="button" data-label="-" aria-label="Bajar volumen"></button>
        <input type="range" id="volume" min="0" max="100" step="1" value="70" aria-label="Volumen general">
        <button class="btn" id="volUp" type="button" data-label="+" aria-label="Subir volumen"></button>
      </div>
      <!-- música del menú: va aparte, pero también la baja el volumen general -->
      <div class="vol-label" style="margin-top: calc(var(--px) * 6)">
        <span data-px="MÚSICA" data-color="#c9b8b8"></span>
        <span id="musicOut" data-px="100%" data-color="#ff5a4a"></span>
      </div>
      <div class="vol-row">
        <button class="btn" id="musDown" type="button" data-label="-" aria-label="Bajar música"></button>
        <input type="range" id="musicVol" min="0" max="100" step="1" value="100" aria-label="Volumen de la música">
        <button class="btn" id="musUp" type="button" data-label="+" aria-label="Subir música"></button>
      </div>
      <div class="row-actions" id="fsRow" style="margin-top: calc(var(--px) * 5)"><button class="btn" id="btnFull" type="button" data-label="PANTALLA COMPLETA" aria-label="Pantalla completa"></button></div>
      <!-- solo en la web (build): desbloquea lo que hay hecho del juego, que aún está en desarrollo -->
      <div class="row-actions" id="wipRow" style="margin-top: calc(var(--px) * 5); flex-direction: column; align-items: center; gap: calc(var(--px) * 2)" hidden>
        <button class="btn" id="btnWip" type="button" data-label="(.WIP.)" aria-label="Desbloquear el juego en desarrollo" aria-pressed="false"></button>
        <span id="wipState" data-px="BLOQUEADO" data-color="#a89090"></span>
      </div>
      <div class="row-actions" style="margin-top: calc(var(--px) * 4)"><button class="btn" id="settingsClose" type="button" data-label="VOLVER" aria-label="Volver"></button></div>
    </div>
  </div>

  <!-- Confirmar salida -->
  <div class="overlay" id="confirm" role="dialog" aria-modal="true" aria-label="¿Salir?">
    <div class="panel">
      <h2 data-px="¿SALIR?" data-scale="2" data-color="#d10a0a"></h2>
      <div class="row-actions" style="margin-top:0">
        <button class="btn" id="confirmYes" type="button" data-label="SI" aria-label="Sí"></button>
        <button class="btn" id="confirmNo" type="button" data-label="NO" aria-label="No"></button>
      </div>
    </div>
  </div>

  <!-- Aviso: empezar partida nueva borra la guardada (solo se puede tener una) -->
  <div class="overlay" id="confirmNew" role="dialog" aria-modal="true" aria-label="Si empiezas una partida nueva, perderás la anterior. ¿Estás seguro?">
    <div class="panel">
      <h2 data-px="AVISO" data-scale="2" data-color="#d10a0a"></h2>
      <div class="warn-lines">
        <span data-px="SI EMPIEZAS UNA" data-color="#c9b8b8"></span>
        <span data-px="PARTIDA NUEVA," data-color="#c9b8b8"></span>
        <span data-px="PERDERÁS LA ANTERIOR." data-color="#c9b8b8"></span>
        <span data-px="¿ESTÁS SEGURO?" data-color="#ff5a4a"></span>
      </div>
      <div class="row-actions">
        <button class="btn" id="confirmNewYes" type="button" data-label="SI" aria-label="Sí, empezar partida nueva"></button>
        <button class="btn" id="confirmNewNo" type="button" data-label="NO" aria-label="No"></button>
      </div>
    </div>
  </div>

  <!-- Nueva partida: introducción (sala vacía, viento y fecha) -->
  <div class="overlay" id="newgame" role="dialog" aria-modal="true" aria-label="Nueva partida">
    <canvas id="introCanvas" role="img" aria-label="Una sala vieja y vacía; la luz se refleja en el espejo"></canvas>
    <!-- 2ª escena: la sala vista desde arriba (jugable) -->
    <canvas id="roomCanvas" role="img" aria-label="El salón visto desde arriba: sofá, cómoda, mesa junto a la ventana y la tele encendida" hidden></canvas>
    <button type="button" class="intro-sub" id="introSubBtn" aria-label="Saltar diálogo" hidden>
      <canvas id="introSub" role="img" aria-label="Subtítulo"></canvas>
    </button>
    <div class="intro-top">
      <button type="button" class="intro-icon-btn" id="introSettings" aria-label="Ajustes"></button>
      <button type="button" class="intro-icon-btn" id="introMenu" aria-label="Menú principal"></button>
    </div>
    <button class="btn intro-hud-phone" id="hudPhone" type="button" aria-label="Abrir teléfono" hidden></button>
    <div class="joystick" id="joystick" role="application" aria-label="Joystick para mover al personaje" hidden><div class="joy-knob"></div></div>
    <div id="phoneUI" role="dialog" aria-modal="true" aria-label="Teléfono">
      <div class="phone-device">
        <canvas id="phoneUICanvas" width="240" height="480" role="img" aria-label="Pantalla del teléfono"></canvas>
        <button type="button" class="phone-side-btn" id="phoneUIClose" aria-label="Apagar teléfono" title="Apagar"></button>
      </div>
    </div>
  </div>

  <!-- Despedida -->
  <div class="overlay solid" id="bye" role="dialog" aria-modal="true" aria-label="Hasta pronto">
    <span data-px="HASTA PRONTO..." data-scale="3" data-color="#d10a0a"></span>
    <span data-px="YA PUEDES CERRAR ESTA VENTANA." data-color="#a89090"></span>
    <button class="btn" id="byeBack" type="button" data-label="VOLVER AL MENU" aria-label="Volver al menú"></button>
  </div>

  <!-- En el móvil la partida se juega en horizontal: en vertical se tapa todo con este aviso -->
  <div id="rotate" role="alert" aria-label="Gira el móvil para jugar en horizontal">
    <div class="rotate-phone" aria-hidden="true"></div>
    <span data-px="GIRA EL MOVIL" data-scale="3" data-color="#d10a0a"></span>
    <div class="warn-lines"><span data-px="LA PARTIDA SE JUEGA" data-color="#a89090"></span><span data-px="EN HORIZONTAL" data-color="#a89090"></span></div>
  </div>

<script>

(() => {
  'use strict';
  const W = 320, H = 180;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const WALL_BASE = 140;   // donde acaba la pared y empieza el suelo
  const G = 152;           // línea del suelo donde se apoyan los objetos

  // ---------- utilidades ----------
  const R = Math.round;
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(R(x), R(y), R(w), R(h)); }
  const r = (x, y, w, h, col) => rect(ctx, x, y, w, h, col);
  function line(x0, y0, x1, y1, col, th) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) || 1;
    for (let i = 0; i <= n; i++) r(x0 + dx * i / n, y0 + dy * i / n, th, th, col);
  }
  function glow(c, cx, cy, rad, rgb, a) {
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g;
    c.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  // ---------- sprites por filas de texto (con contorno automático) ----------
  const PAL = { r:'#c40e0e', R:'#ff4545', w:'#d9d2bf', g:'#2f8f3a', k:'#150506',
                y:'#d6a81c', Y:'#ffe27a', b:'#6b4416' };
  function makeSprite(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
    const x = c.getContext('2d');
    const f = (i, j) => i >= 0 && j >= 0 && i < h && j < w && rows[i][j] !== '.';
    for (let i = -1; i <= h; i++) for (let j = -1; j <= w; j++) {
      if (f(i, j)) { x.fillStyle = PAL[rows[i][j]]; x.fillRect(j + 1, i + 1, 1, 1); }
      else if (f(i-1, j) || f(i+1, j) || f(i, j-1) || f(i, j+1)) { x.fillStyle = PAL.k; x.fillRect(j + 1, i + 1, 1, 1); }
    }
    return c;
  }
  const SEVEN = makeSprite([
    '########','########','......##','.....##.','.....##.','....##..',
    '....##..','...##...','...##...','..##....','..##....'
  ].map((s, i) => s.replace(/#/g, i < 2 ? 'R' : 'r')));
  const CHERRY = makeSprite([
    '.......gg...','......g.g...','.....g...g..','....g....g..',
    '..rrr...rrr.','.rrrrr.rrrrr','.rRrrr.rRrrr','.rrrrr.rrrrr','..rrr...rrr.'
  ]);
  const BAR = makeSprite([
    'YYYYYYYYYYYY','yyyyyyyyyyyy','yykkyykkyykk','yykkyykkyykk','yyyyyyyyyyyy','bbbbbbbbbbbb'
  ]);
  const BELL = makeSprite([
    '....yy....','...yYYy...','..yYYyyy..','..yYyyyy..','..yYyyyy..',
    '.yYyyyyyy.','.yYyyyyyy.','yyyyyyyyyy','bbbbbbbbbb','....bb....'
  ]);
  const SKULL = makeSprite([
    '..wwwwww..','.wwwwwwww.','wwwwwwwwww','wwkkwwkkww','wwkkwwkkww',
    'wwwwkkwwww','.wwwwwwww.','..wkwkwk..','..wkwkwk..'
  ]);
  const STRIP = [SEVEN, CHERRY, SKULL, BAR, BELL, SKULL, CHERRY, BELL, SKULL, BAR]; // índice 0 = 7
  const N = STRIP.length;
  function drawSpriteC(spr, cx, cy, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.drawImage(spr, R(cx - spr.width / 2), R(cy - spr.height / 2));
    ctx.globalAlpha = 1;
  }

  // ---------- capa estática: pared, suelo y cajas de mudanza ----------
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const bx = bg.getContext('2d');
  const rb = (x, y, w, h, c) => rect(bx, x, y, w, h, c);

  // pared con papel pintado desgastado
  rb(0, 0, W, WALL_BASE, '#130708');
  for (let x = 0; x < W; x += 10) {
    rb(x, 0, 5, WALL_BASE, '#170909');
    rb(x + 5, 0, 1, WALL_BASE, '#0e0506');
  }
  for (let i = 0; i < 180; i++) {            // manchas de humedad
    rb(hash(i) * W, hash(i + 90) * WALL_BASE, 1 + hash(i + 7) * 3, 1, '#0d0505');
  }
  rb(0, WALL_BASE - 6, W, 6, '#1f0f10');      // rodapié
  rb(0, WALL_BASE - 6, W, 1, '#2d1718');
  // suelo de tablas
  for (let y = WALL_BASE, k = 0; y < H; y += 6, k++) {
    rb(0, y, W, 6, k % 2 ? '#1b1010' : '#170d0d');
    rb(0, y, W, 1, '#0c0606');
    const off = (k * 37) % 53;
    for (let x = off; x < W; x += 53) rb(x, y, 1, 6, '#0c0606');
  }

  // cajas de mudanza
  const COL = ['#8b5f34', '#7d5430', '#946a3c'];
  function box(x, yTop, w, h, v) {
    const base = COL[v % 3];
    rb(x, yTop, w, h, '#2a170a');
    rb(x + 1, yTop + 1, w - 2, h - 2, base);
    rb(x + 1, yTop + 1, w - 2, 3, '#a87b48');            // solapas superiores
    rb(x + 1, yTop + 4, w - 2, 1, '#5c3b1e');
    rb(x + 1, yTop + 1, 1, h - 2, '#a37444');            // borde iluminado
    rb(x + w - 3, yTop + 1, 2, h - 2, '#5f3f20');        // lado en sombra
    for (let i = 0; i < w * h / 30; i++) {               // textura cartón
      rb(x + 2 + hash(i * 3.1 + v) * (w - 5), yTop + 5 + hash(i * 5.7 + v) * (h - 8), 1, 1, '#6b4725');
    }
    const tx = x + Math.floor(w / 2) - 2;                // cinta de embalar
    rb(tx, yTop + 1, 4, Math.floor(h * 0.5), '#c8b27a');
    rb(tx, yTop + 1, 1, Math.floor(h * 0.5), '#e0cf9a');
    if (w >= 28 && h >= 22 && v % 2 === 0) {             // etiqueta
      const lx = x + 4, ly = yTop + h - 10;
      rb(lx, ly, 9, 6, '#d8d0b8'); rb(lx + 1, ly + 1, 5, 1, '#444'); rb(lx + 1, ly + 3, 7, 1, '#444');
    }
    if (v % 3 === 1 && w >= 26) {                        // FRÁGIL
      rb(x + w - 15, yTop + h - 9, 10, 4, '#b01818');
      rb(x + w - 14, yTop + h - 8, 2, 2, '#f0e0e0'); rb(x + w - 10, yTop + h - 8, 2, 2, '#f0e0e0');
    }
  }
  const BOXES = [
    // izquierda
    [8, G-32, 38, 32, 0], [14, G-58, 30, 26, 1], [58, G-24, 30, 24, 2], [62, G-42, 22, 18, 0], [92, G-16, 24, 16, 1],
    // derecha
    [214, G-16, 24, 16, 2], [242, G-28, 30, 28, 1], [246, G-46, 22, 18, 0], [276, G-34, 34, 34, 0], [280, G-56, 26, 22, 2],
  ];
  // sombras en el suelo
  BOXES.forEach(([x, , w]) => { bx.fillStyle = 'rgba(0,0,0,.45)'; bx.fillRect(x - 2, G - 1, w + 5, 4); });
  BOXES.forEach(b => box(...[b[0], b[1], b[2], b[3], b[4]]));
  // oscurecer todo (el ambiente es oscuro; la máquina es la luz)
  bx.fillStyle = 'rgba(0,0,0,.42)'; bx.fillRect(0, 0, W, H);

  // ---------- la tragaperras ----------
  const MX = 122, MY = 52;           // esquina superior izquierda de la máquina
  const SPEED = 16;                  // celdas por segundo
  const STOP = [2.0, 2.7, 3.4];      // cuándo se detiene cada rodillo
  const g = tau => tau < 0.3 ? 0.5 * tau * tau / 0.3 : tau - 0.15;   // aceleración inicial
  const reels = STOP.map(stopT => {
    const p0 = SPEED * g(stopT - 0.5);
    const target = (Math.floor(p0 / N) + 2) * N;   // siempre acaba en un 7
    const dist = target - p0, dur = 2 * dist / SPEED;
    return { stopT, p0, target, dur, finish: stopT + dur };
  });
  const WIN_START = Math.max(...reels.map(q => q.finish)) + 0.15;
  const WIN_END = WIN_START + 2.2;
  const CYCLE = WIN_END + 0.8;
  function reelPos(q, t) {
    if (t < 0.5) return 0;
    if (t < q.stopT) return SPEED * g(t - 0.5);
    if (t < q.finish) { const u = (t - q.stopT) / q.dur; return q.p0 + (q.target - q.p0) * (1 - (1 - u) * (1 - u)); }
    return q.target;
  }
  const ease = u => u * u * (3 - 2 * u);

  function leverPos(t) {
    if (t < 0.2) return 0;
    if (t < 0.55) return ease((t - 0.2) / 0.35);
    if (t < 0.7) return 1;
    if (t < 1.3) return 1 - ease((t - 0.7) / 0.6);
    return 0;
  }

  const WIN_X = [MX + 11, MX + 30, MX + 49], WIN_Y = MY + 32, WIN_W = 17, WIN_H = 26, CELL = 16;

  // dígitos minúsculos 3x5 para la pantalla LED de créditos
  const MINI = {
    '0':'XXX|X.X|X.X|X.X|XXX','1':'.X.|XX.|.X.|.X.|XXX','2':'XXX|..X|XXX|X..|XXX','3':'XXX|..X|XXX|..X|XXX',
    '4':'X.X|X.X|XXX|..X|..X','5':'XXX|X..|XXX|..X|XXX','6':'XXX|X..|XXX|X.X|XXX','7':'XXX|..X|..X|..X|..X',
    '8':'XXX|X.X|XXX|X.X|XXX','9':'XXX|X.X|XXX|..X|XXX'
  };
  function drawMini(str, rightX, y, col) {
    let x = rightX - (str.length * 4 - 1);
    for (const ch of str) {
      MINI[ch].split('|').forEach((row, ry) => { for (let i = 0; i < 3; i++) if (row[i] === 'X') r(x + i, y + ry, 1, 1, col); });
      x += 4;
    }
  }

  // v = estado visual: { spinning, winning, leverP, reel(i)->{pos,spd}, led, header, green, slotGlow }
  function drawMachine(t, v) {
    const spinning = v.spinning, winning = v.winning;
    // cuerpo
    r(MX - 1, MY - 1, 78, 102, '#0d0304');
    r(MX, MY, 76, 100, '#43100f');
    r(MX, MY, 3, 100, '#6a1c1a');            // luz en el borde izquierdo
    r(MX + 73, MY, 3, 100, '#240808');       // sombra derecha
    r(MX + 36, MY, 2, 100, '#4a1312');       // brillo vertical
    r(MX, MY + 96, 76, 4, '#1a0607');        // base

    // cabecera: tres 7 o mensajes del juego
    r(MX + 5, MY + 5, 66, 22, '#6b5014');
    r(MX + 6, MY + 6, 64, 20, '#1a0505');
    const PD = window.PD;
    if (v.header && PD) {
      if (v.header.on) {
        const lines = v.header.lines.map(PD.norm), total = lines.length * 7 + (lines.length - 1) * 2;
        const y0 = MY + 6 + Math.floor((20 - total) / 2);
        lines.forEach((ln, i) => PD.drawText(ctx, ln, MX + 6 + Math.floor((64 - PD.measure(ln)) / 2), y0 + i * 9, v.header.color));
      }
    } else {
      const sevAlpha = winning ? (Math.floor(t * 8) % 2 ? 1 : 0.55) : 0.3;
      for (let i = 0; i < 3; i++) drawSpriteC(SEVEN, MX + 22 + i * 16, MY + 16, sevAlpha);
    }

    // bombillas del marco
    const chase = winning ? 9 : spinning ? 7 : 2;
    for (let i = 0; i < 9; i++) {
      const on = winning ? ((i + Math.floor(t * chase)) % 2 === 0) : ((i + Math.floor(t * chase)) % 3 === 0);
      const col = on ? (winning && i % 2 ? '#ff3a3a' : '#ffd23a') : '#4a3a10';
      r(MX + 6 + i * 7, MY + 2, 3, 2, col);
      r(MX + 6 + i * 7, MY + 28, 3, 2, col);
    }

    // marco y rodillos
    const flashA = winning && Math.floor(t * 10) % 2 === 0;
    r(MX + 8, MY + 30, 60, 32, '#6b5014');
    r(MX + 9, MY + 31, 58, 30, flashA ? '#ffe27a' : '#b8922a');
    r(MX + 9, MY + 31, 58, 1, '#f0d060');
    for (let i = 0; i < 3; i++) {
      const x = WIN_X[i], { pos, spd } = v.reel(i);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, WIN_Y, WIN_W, WIN_H); ctx.clip();
      r(x, WIN_Y, WIN_W, WIN_H, '#a8977a');
      const cy0 = WIN_Y + WIN_H / 2;
      for (let k = Math.floor(pos) - 2; k <= Math.floor(pos) + 2; k++) {
        const spr = STRIP[((k % N) + N) % N];
        const cy = cy0 + (pos - k) * CELL;
        if (spd > 10) { drawSpriteC(spr, x + WIN_W / 2, cy - 4, 0.35); drawSpriteC(spr, x + WIN_W / 2, cy + 4, 0.35); }
        drawSpriteC(spr, x + WIN_W / 2, cy, spd > 10 ? 0.75 : 1);
      }
      // sombreado cilíndrico
      [[0, .6], [1, .38], [2, .2], [3, .08]].forEach(([d, a]) => {
        r(x, WIN_Y + d, WIN_W, 1, `rgba(0,0,0,${a})`);
        r(x, WIN_Y + WIN_H - 1 - d, WIN_W, 1, `rgba(0,0,0,${a})`);
      });
      ctx.restore();
    }
    if (winning && Math.floor(t * 6) % 2 === 0) r(MX + 10, WIN_Y + WIN_H / 2, 56, 1, '#ff3030');   // línea de premio

    // panel de botones (el verde es el secreto)
    r(MX + 8, MY + 66, 60, 16, '#240808'); r(MX + 8, MY + 66, 60, 1, '#6a1c1a');
    const bl = winning ? (Math.floor(t * 8) % 2) : 0;
    r(MX + 14, MY + 70, 6, 6, '#0d0304'); r(MX + 15, MY + 71, 4, 4, bl ? '#ff5050' : '#a01212');
    r(MX + 26, MY + 70, 6, 6, '#0d0304'); r(MX + 27, MY + 71, 4, 4, bl ? '#a01212' : '#e0b020');
    r(MX + 38, MY + 70, 6, 6, '#0d0304'); r(MX + 39, MY + 71, 4, 4, v.green);
    r(MX + 49, MY + 69, 15, 8, '#0d0304');                                  // pantalla LED
    if (v.led != null) drawMini(v.led.text, MX + 62, MY + 71, v.led.color);
    else for (let i = 0; i < 3; i++) r(MX + 51 + i * 4, MY + 71, 3, 4, winning ? '#ff3030' : '#4a0c0c');

    // ranura de monedas y bandeja
    if (v.slotGlow) { ctx.globalAlpha = 0.22 + 0.12 * Math.sin(t * 12); r(MX + 27, MY + 82, 22, 9, '#ffe27a'); ctx.globalAlpha = 1; }
    r(MX + 30, MY + 86, 16, 3, '#0d0304');
    r(MX + 32, MY + 87, 12, 1, v.slotGlow && Math.floor(t * 6) % 2 ? '#ffe27a' : '#c9a227');
    r(MX + 22, MY + 92, 32, 6, '#0d0304'); r(MX + 23, MY + 93, 30, 4, '#1c0809');

    // palanca
    const p = v.leverP;
    const px = MX + 76, py = MY + 44;
    const ux = MX + 85, uy = MY + 14, dx = MX + 85, dy = MY + 64;
    const bx2 = ux + (dx - ux) * p, by2 = uy + (dy - uy) * p;
    r(px - 1, py - 4, 5, 10, '#2a2a30');
    line(px + 2, py, bx2 + 2, by2 + 2, '#0d0304', 4);
    line(px + 2, py, bx2 + 2, by2 + 2, '#9aa0a8', 2);
    r(bx2 - 1, by2 - 1, 8, 8, '#0d0304'); r(bx2, by2, 6, 6, '#d01818'); r(bx2 + 1, by2 + 1, 2, 2, '#ff8080');
  }

  // ---------- partículas de polvo ----------
  const dust = Array.from({ length: 28 }, (_, i) => ({
    x: hash(i) * W, y: hash(i + 40) * H, vx: (hash(i + 80) - 0.5) * 3, vy: -1 - hash(i + 120) * 2, ph: hash(i + 160) * 6
  }));

  // =====================================================================
  //  MINIJUEGO SECRETO: botón verde de la tragaperras
  //  3 monedas -> arrástralas a la ranura -> palanca -> premio al azar
  // =====================================================================
  const COIN = makeSprite([
    '..yyy..', '.yYYyy.', 'yYyyyyb', 'yyyyyyb', 'yyyyybb', '.yybbb.', '..bbb..'
  ]);
  const SYMID = [0, 1, 3, 2, 4, 3, 1, 4, 3, 2];          // 0=siete 1=cereza 2=BAR 3=calavera 4=campana (misma tira que STRIP)
  const PAY3 = { 0: 100, 2: 20, 4: 15, 1: 10, 3: 5 };    // premio por tres iguales
  function evaluate(idx) {
    const ids = idx.map(i => SYMID[i]);
    if (ids[0] === ids[1] && ids[1] === ids[2]) return { amount: PAY3[ids[0]], id: ids[0], three: true };
    const c = ids.filter(x => x === 1).length;
    if (c === 2) return { amount: 2 };                    // dos cerezas (donde sea)
    if (ids[0] === 1) return { amount: 1 };               // una cereza en el primer rodillo
    return { amount: 0 };
  }

  const nowS = () => performance.now() / 1000;
  const snd = (name, ...a) => { const A = window.GameAudio; if (A && A[name]) A[name](...a); };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const TP = matchMedia('(pointer: coarse)').matches ? 4 : 0;       // margen extra de toque en móvil
  const buzz = p => { if (TP && navigator.vibrate) try { navigator.vibrate(p); } catch (_) {} };   // vibración en móvil (Android)
  const GREEN = { x: MX + 36 - TP, y: MY + 68 - TP, w: 10 + 2 * TP, h: 10 + 2 * TP };
  const SLOT = { x: MX + 26 - TP, y: MY + 78 - TP, w: 24 + 2 * TP, h: 12 + TP };
  const SLOTX = MX + 38, SLOTY = MY + 81, SLOT_TOP = MY + 87;
  const inRect = (p, q) => p.x >= q.x && p.x <= q.x + q.w && p.y >= q.y && p.y <= q.y + q.h;

  let mode = 'attract';              // 'attract' (la slot va sola) | 'play'
  let attractStart = 0, hoverGreen = false;
  const play = { coins: [], drag: null, recs: [], parts: [], credits: 0, state: 'idle', lever0: -99, stopped: [true, true, true], win: null, result: null, until: 0, nextTick: 0 };
  const attractT = ts => (ts - attractStart) % CYCLE;

  // movimiento de un rodillo en una tirada concreta
  function makeSpinRec(startPos, T0, i, idx) {
    const spinStart = T0 + 0.3, stopT = T0 + 1.1 + i * 0.55;
    const p0 = startPos + SPEED * g(stopT - spinStart);
    const base = Math.ceil(p0) + 3;
    const target = base + (((idx - base) % N) + N) % N;       // siempre cae en el símbolo elegido
    const dur = 2 * (target - p0) / SPEED;
    return { startPos, spinStart, stopT, p0, target, dur, finish: stopT + dur };
  }
  function makeSettleRec(startPos, T0, toSeven) {              // frena suavemente a una posición limpia
    const target = toSeven ? Math.ceil(startPos / N) * N : Math.ceil(startPos);
    const dur = Math.max(0.3, 2 * (target - startPos) / SPEED);
    return { startPos, spinStart: T0, stopT: T0, p0: startPos, target, dur, finish: T0 + dur };
  }
  function recPos(q, t) {
    if (t < q.spinStart) return q.startPos;
    if (t < q.stopT) return q.startPos + SPEED * g(t - q.spinStart);
    if (t < q.finish) { const u = (t - q.stopT) / q.dur; return q.p0 + (q.target - q.p0) * (1 - (1 - u) * (1 - u)); }
    return q.target;
  }
  const lastFinish = () => Math.max(...play.recs.map(q => q.finish));

  function startPlay(ts) {
    const ta = attractT(ts);
    play.recs = reels.map(q => makeSettleRec(reelPos(q, ta) % N, ts, false));
    Object.assign(play, { credits: 0, state: 'idle', lever0: -99, win: null, result: null, parts: [], drag: null, stopped: [true, true, true] });
    play.coins = [0, 1, 2].map(i => ({ home: { x: MX + 28 + i * 10, y: MY + 95 }, x: MX + 38, y: MY + 95, state: 'pop', t0: ts + 0.35 + i * 0.22, dropped: false }));
    mode = 'play'; setFocus(true);
  }
  function endPlay(ts) {
    if (mode !== 'play' || play.state === 'closing') return;
    play.recs = play.recs.map(q => makeSettleRec(recPos(q, ts) % N, ts, true));
    Object.assign(play, { coins: [], drag: null, state: 'closing', credits: 0, win: null, parts: [] });
    setFocus(false);
  }
  const canPull = ts => mode === 'play' && play.state === 'idle' && play.credits > 0 && ts >= lastFinish();
  function pull(ts) {
    const idx = [0, 1, 2].map(() => Math.floor(Math.random() * N));   // resultado 100% aleatorio
    play.credits--; play.lever0 = ts; play.state = 'spinning'; play.nextTick = ts + 0.3; play.stopped = [false, false, false];
    play.result = { idx };
    play.recs = play.recs.map((q, i) => makeSpinRec(q.target % N, ts, i, idx[i]));
    snd('lever'); buzz(30);
  }
  function finishSpin(ts) {
    const res = evaluate(play.result.idx);
    if (res.amount > 0) {
      const ti = Math.min(0.12, 1.4 / res.amount);
      play.win = { amount: res.amount, given: 0, nextTick: ts + 0.25, ti, end: ts + 0.25 + res.amount * ti + 0.9, jackpot: !!res.three && res.id === 0 };
      play.state = 'win'; snd('win', res.amount >= 10); buzz(res.amount >= 10 ? [60, 50, 60, 50, 120] : [40, 40, 40]);
      const n = Math.min(12, 2 + Math.floor(res.amount / 3));
      for (let i = 0; i < n; i++) play.parts.push({ x: MX + 38, y: MY + 94, vx: (Math.random() - 0.5) * 90, vy: -70 - Math.random() * 70, gy: G + 2 + Math.random() * 12, born: ts + i * 0.05 });
    } else { play.state = 'lose'; play.until = ts + 1.0; snd('lose'); }
  }
  function afterRound(ts) {
    play.win = null;
    if (play.credits > 0 || play.coins.length > 0) play.state = 'idle';
    else { play.state = 'over'; play.until = ts + 2.0; }      // se acabó el dinero
  }

  function update(ts, dt) {
    if (mode !== 'play') return;
    const P = play;
    P.coins.forEach(c => {
      if (c.state === 'pop') {
        if (ts < c.t0) return;
        if (!c.dropped) { c.dropped = true; snd('coinDrop'); }
        const u = (ts - c.t0) / 0.3;
        if (u >= 1) { c.state = 'idle'; c.x = c.home.x; c.y = c.home.y; }
        else { c.x = c.home.x; c.y = c.home.y - 16 * Math.sin(Math.PI * u); }
      } else if (c.state === 'return') {
        const u = Math.min(1, (ts - c.t0) / 0.25), e = 1 - (1 - u) * (1 - u);
        c.x = c.fx + (c.home.x - c.fx) * e; c.y = c.fy + (c.home.y - c.fy) * e;
        if (u >= 1) c.state = 'idle';
      } else if (c.state === 'insert') {
        const u = ts - c.t0;
        if (u < 0.12) { const e = u / 0.12; c.x = c.fx + (SLOTX - c.fx) * e; c.y = c.fy + (SLOTY - c.fy) * e; }
        else if (u < 0.32) { c.x = SLOTX; c.y = SLOTY + 10 * ((u - 0.12) / 0.2); }
        else { c.dead = true; P.credits++; }
      }
    });
    P.coins = P.coins.filter(c => !c.dead);

    if (P.state === 'spinning') {
      if (P.stopped.some(s => !s) && ts >= P.nextTick) { snd('tick'); P.nextTick = ts + 0.07; }
      P.recs.forEach((q, i) => { if (!P.stopped[i] && ts >= q.finish) { P.stopped[i] = true; snd('reelStop'); } });
      if (ts >= lastFinish()) finishSpin(ts);
    } else if (P.state === 'win') {
      const w = P.win;
      while (w.given < w.amount && ts >= w.nextTick) {          // los créditos suben poco a poco
        P.credits++; w.given++; w.nextTick += w.ti;
        if (w.ti >= 0.04 || w.given % 4 === 0) snd('coinTick');
      }
      if (ts >= w.end) afterRound(ts);
    } else if (P.state === 'lose') { if (ts >= P.until) afterRound(ts); }
    else if (P.state === 'over') { if (ts >= P.until) endPlay(ts); }
    else if (P.state === 'closing') { if (ts >= lastFinish()) { mode = 'attract'; attractStart = ts; } }

    P.parts = P.parts.filter(p => ts - p.born < 3);               // monedas que saltan al ganar
    P.parts.forEach(p => {
      if (ts < p.born) return;
      p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > p.gy && p.vy > 0) { p.y = p.gy; p.vy *= -0.45; p.vx *= 0.7; }
    });
  }

  function headerFor(ts) {
    const P = play, on = (ts % 1.2) < 0.9;
    switch (P.state) {
      case 'idle': return P.credits > 0 ? { lines: ['TIRA DE LA', 'PALANCA'], color: '#ff6b5a', on } : { lines: ['ARRASTRA', 'MONEDAS'], color: '#ffd23a', on };
      case 'win': return P.win && P.win.jackpot ? { lines: ['JACKPOT', '777!!'], color: Math.floor(ts * 8) % 2 ? '#ff3030' : '#ffe27a', on: true }
                                                  : { lines: ['GANAS', '+' + (P.win ? P.win.amount : 0)], color: '#ffe27a', on: true };
      case 'lose': return { lines: ['SIN', 'PREMIO'], color: '#a05050', on: true };
      case 'over': return { lines: ['SIN', 'MONEDAS'], color: '#c01212', on: true };
      default: return null;
    }
  }

  function drawCoins(ts) {
    play.coins.forEach(c => {
      if (c.state === 'pop' && ts < c.t0) return;
      if (c.state === 'insert') {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SLOT_TOP); ctx.clip();
        drawSpriteC(COIN, c.x, c.y); ctx.restore(); return;
      }
      if (c.state === 'drag') { ctx.globalCompositeOperation = 'screen'; glow(ctx, R(c.x), R(c.y), 14, '255,210,90', 0.35); ctx.globalCompositeOperation = 'source-over'; }
      drawSpriteC(COIN, c.x, c.y);
      if (c.state === 'idle' && Math.floor(ts * 2.2 + c.home.x) % 5 === 0) r(c.x - 2, c.y - 2, 1, 1, '#fff6c0');
    });
    play.parts.forEach(p => {
      if (ts < p.born) return;
      const age = ts - p.born; ctx.globalAlpha = age > 2.5 ? Math.max(0, (3 - age) * 2) : 1;
      drawSpriteC(COIN, p.x, p.y); ctx.globalAlpha = 1;
    });
  }

  // ---------- ratón / táctil ----------
  function toLogical(e) {
    const rc = cv.getBoundingClientRect();
    return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
  }
  // Composición centrada: título, máquina y botones en columna, centrados en horizontal (el cuerpo de la
  // máquina, x = 160, en el centro exacto) y con el mismo espacio arriba, entre ellos y abajo.
  // Si para que todo respire la escena no llega a cubrir la pantalla, se funde con el negro por los bordes.
  const menuEl = document.getElementById('menu'), navEl = document.getElementById('menuButtons');
  const titleEl = document.getElementById('titleCanvas'), exitBtn = document.getElementById('slotExit');
  const MACH_TOP = MY - 1, MACH_H = G + 3 - MACH_TOP;          // de las bombillas a la sombra en el suelo
  const safe = document.createElement('div');                  // lee las zonas seguras (notch, barra de gestos)
  safe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)';
  document.body.appendChild(safe);
  function layoutScene() {
    const vw = innerWidth, vh = innerHeight, portrait = document.documentElement.dataset.layout === 'portrait';
    const cs = getComputedStyle(safe), st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const room = vh - st - sb - titleEl.getBoundingClientRect().height - navEl.getBoundingClientRect().height;
    const gmin = Math.max(10, vh * 0.035);
    let s = portrait ? Math.min(vw / 135, 0.42 * vh / MACH_H)                     // vertical: la máquina y un poco de sala
                     : Math.min(Math.max(vw / W, vh / H), 0.5 * vh / MACH_H);     // horizontal: llena la pantalla si cabe
    s = Math.max(0.5, Math.min(s, (room - 4 * gmin) / MACH_H));
    const gap = (room - MACH_H * s) / 4, mTop = st + 2 * gap + titleEl.getBoundingClientRect().height;
    const left = vw / 2 - (W / 2) * s, top = mTop - MACH_TOP * s;
    menuEl.style.paddingTop = st + gap + 'px';
    navEl.style.top = mTop + MACH_H * s + gap + 'px'; navEl.style.bottom = 'auto';
    cv.classList.toggle('fade-x', left > 0.5 || left + W * s < vw - 0.5);
    cv.classList.toggle('fade-y', top > 0.5 || top + H * s < vh - 0.5);
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.style.left = left + 'px'; cv.style.top = top + 'px';
    cv.style.transform = focus ? focusTransform(s, left, top, vw, vh) : '';
  }
  window.addEventListener('pd:layout', layoutScene);

  // Al jugar, la cámara se acerca a la máquina (más grande = más fácil de tocar) y se esconden título y botones
  let focus = false;
  const BOX = { x: MX - 5, y: MY - 5, w: 101, h: 110 };      // máquina + palanca + bandeja de monedas
  function focusTransform(s, left, top, vw, vh) {
    const m = 8, eb = exitBtn.getBoundingClientRect();
    const fit = (y0) => clamp(Math.min((vw - 2 * m) / (BOX.w * s), (vh - y0 - m) / (BOX.h * s)), 1, 1.6);
    let y0 = m, z = fit(y0);
    if (vw / 2 + z * s * BOX.w / 2 > eb.left - m) { y0 = eb.bottom + m; z = fit(y0); }   // no meterse debajo de VOLVER
    const tx = vw / 2 - left - z * s * (BOX.x + BOX.w / 2), ty = (y0 + vh - m) / 2 - top - z * s * (BOX.y + BOX.h / 2);
    return `translate(${tx}px, ${ty}px) scale(${z})`;
  }
  function setFocus(on) {
    focus = on; menuEl.classList.toggle('slot-play', on);
    if (on && document.activeElement && menuEl.contains(document.activeElement)) document.activeElement.blur();
    layoutScene();
  }
  exitBtn.addEventListener('click', () => endPlay(nowS()));
  function leverHit(p, ts) {
    const lp = leverPos(ts - play.lever0 + 0.15);
    const bx = MX + 88, by = MY + 17 + 50 * lp, ax = MX + 78, ay = MY + 44;     // bola y arranque de la palanca
    const vx = bx - ax, vy = by - ay, k = clamp(((p.x - ax) * vx + (p.y - ay) * vy) / (vx * vx + vy * vy), 0, 1);
    return Math.hypot(p.x - (ax + vx * k), p.y - (ay + vy * k)) <= 7 + TP || Math.hypot(p.x - bx, p.y - by) <= 10 + TP;
  }
  cv.style.touchAction = 'none';
  cv.addEventListener('pointerdown', e => {
    if (window.GameAudio) window.GameAudio.init();
    const ts = nowS(), p = toLogical(e);
    if (inRect(p, GREEN)) { if (mode === 'attract') startPlay(ts); else endPlay(ts); snd('click'); e.preventDefault(); return; }
    if (mode !== 'play' || play.state === 'closing') return;
    for (let i = play.coins.length - 1; i >= 0; i--) {
      const c = play.coins[i];
      if (c.state === 'idle' && Math.hypot(p.x - c.x, p.y - c.y) <= 9 + TP) {
        c.state = 'drag'; c.x = p.x; c.y = p.y; play.drag = c;           // la moneda se centra justo donde está el dedo o el ratón
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
        cv.style.cursor = 'grabbing'; e.preventDefault(); return;
      }
    }
    if (canPull(ts) && leverHit(p, ts)) { pull(ts); e.preventDefault(); }
  });
  cv.addEventListener('pointermove', e => {
    const p = toLogical(e);
    if (play.drag) { play.drag.x = clamp(p.x, 4, W - 4); play.drag.y = clamp(p.y, 4, H - 4); return; }
    hoverGreen = inRect(p, GREEN);
    let cur = hoverGreen ? 'pointer' : '';
    if (!cur && mode === 'play' && play.state !== 'closing') {
      if (play.coins.some(c => c.state === 'idle' && Math.hypot(p.x - c.x, p.y - c.y) <= 9 + TP)) cur = 'grab';
      else if (canPull(nowS()) && leverHit(p, nowS())) cur = 'pointer';
    }
    cv.style.cursor = cur;
  });
  cv.addEventListener('pointerleave', () => { hoverGreen = false; });
  const endDrag = () => {
    const c = play.drag; if (!c) return;
    play.drag = null; const ts = nowS();
    c.fx = c.x; c.fy = c.y; c.t0 = ts;
    if (inRect({ x: c.x, y: c.y }, SLOT)) { c.state = 'insert'; snd('coinIn'); buzz(15); } else c.state = 'return';
    cv.style.cursor = '';
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && mode === 'play' && !document.querySelector('.overlay.open')) endPlay(nowS());
  });

  // ---------- bucle principal ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const ts = now / 1000;
    update(ts, dt);

    // estado visual según el modo
    let v, tm;
    if (mode === 'attract') {
      tm = attractT(ts);
      v = {
        spinning: tm >= 0.5 && tm < WIN_START, winning: tm >= WIN_START && tm < WIN_END,
        leverP: leverPos(tm), header: null, led: null, slotGlow: false,
        green: hoverGreen ? '#5fe070' : (ts % 5 < 0.3 ? '#7cff8a' : '#2f8f3a'),          // guiño discreto al secreto
        reel: i => ({ pos: reelPos(reels[i], tm), spd: (reelPos(reels[i], tm) - reelPos(reels[i], tm - 0.016)) / 0.016 })
      };
    } else {
      tm = ts;
      v = {
        spinning: play.state === 'spinning', winning: play.state === 'win',
        leverP: leverPos(ts - play.lever0 + 0.15), header: headerFor(ts), slotGlow: !!play.drag,
        led: { text: String(Math.min(999, play.credits)), color: play.credits > 0 ? '#ff3030' : '#6a1010' },
        green: '#5fe070',
        reel: i => ({ pos: recPos(play.recs[i], ts), spd: (recPos(play.recs[i], ts) - recPos(play.recs[i], ts - 0.016)) / 0.016 })
      };
    }
    const spinning = v.spinning, winning = v.winning;

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0);

    // luz de la máquina sobre pared, suelo y cajas
    const pulse = winning ? 0.5 + 0.2 * Math.sin(tm * 14) : spinning ? 0.28 + 0.06 * hash(Math.floor(tm * 30)) : 0.2 + 0.04 * Math.sin(tm * 3);
    const rgb = winning ? '255,70,40' : '255,150,60';
    ctx.globalCompositeOperation = 'screen';
    glow(ctx, MX + 38, MY + 46, winning ? 120 : 95, rgb, pulse);
    ctx.save(); ctx.translate(MX + 38, G + 2); ctx.scale(2.4, 0.35);
    glow(ctx, 0, 0, 50, rgb, pulse * 1.3); ctx.restore();
    ctx.globalCompositeOperation = 'source-over';

    // ojos en la rendija entre cajas (a ratos)
    const ec = ts % 9;
    if (ec > 3 && ec < 7.6 && !(ec > 5.2 && ec < 5.35)) {
      glow(ctx, 52, G - 17, 9, '255,30,30', 0.35);
      r(49, G - 18, 2, 2, '#ff2a2a'); r(54, G - 18, 2, 2, '#ff2a2a');
    }

    // sombra de la máquina, la máquina y las monedas
    r(MX - 3, G, 82, 3, 'rgba(0,0,0,.5)');
    drawMachine(tm, v);
    if (mode === 'play') drawCoins(ts);

    // polvo flotante
    ctx.fillStyle = 'rgba(255,200,170,.28)';
    dust.forEach(d => {
      d.x += (d.vx + Math.sin(now / 900 + d.ph) * 2) * dt; d.y += d.vy * dt;
      if (d.y < -2) { d.y = H + 2; d.x = Math.random() * W; }
      if (d.x < -2) d.x = W + 2; if (d.x > W + 2) d.x = -2;
      ctx.fillRect(R(d.x), R(d.y), 1, 1);
    });

    // parpadeo de luz ambiente ocasional
    if (hash(Math.floor(now / 55)) > 0.965) { ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.fillRect(0, 0, W, H); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

  function parse(str) {

      : { hi: '#7a1010', lo: '#3a0505', fill: '#0d0405', txt: '#c01212' };

  /* =====================================================================
     AUDIO: volumen general (master)
     Todo sonido futuro (música, efectos) debe conectarse a GameAudio.master

      }

    }
    function setMusicVolume(v) {

    const bufs = {};

  /* =====================================================================
     MÚSICA DEL MENÚ: lounge tranquilo de casa de apuestas, en 8 bits.
     Fa mayor, 92 bpm, swing suave y ritmo de bossa; 32 compases (la 2ª vuelta deja descansar la melodía).
     Se toca en tiempo real como un secuenciador de consola: cada compás se programa en el reloj de audio un
     poco antes de que suene, así arranca al instante, gasta muy poco y el bucle no tiene costuras.
     Canales: pulso 50% (melodía, con vibrato), pulso 25% (acordes), triángulo (bajo), ruido (shaker).
     Para que suene limpio: melodía y bajo tocan una nota cada vez (la anterior se apaga antes de la siguiente),
     cada canal tiene su altura (bajo < acordes, por debajo de Mi4 < melodía) y no hay eco que se monte encima.
     ===================================================================== */
  const MenuMusic = (() => {
    const BPM = 92, BEAT = 60 / BPM, BAR = 4 * BEAT, SWING = 0.58, BARS = 32, AHEAD = 0.6;
    const LEVEL = 0.24;                                         // medido: RMS 0.05 y picos 0.21 (más bajo que el viento y las voces)

    const hz = n => 440 * Math.pow(2, (midi(n) - 69) / 12);
    const sw = beat => (Math.floor(beat) + (beat % 1 === 0.5 ? SWING : beat % 1)) * BEAT;   // tiempo dentro del compás, corcheas con swing
    const span = (s, d) => sw(s + d) - sw(s);                  // duración real de una nota, con el swing aplicado a su final
    const gate = (s, d, rel) => Math.min(span(s, d) * 0.9, span(s, d) - rel - 0.01);   // nota + su cola terminan antes de la siguiente

    // acordes: bajo (fundamental) y 3 notas sin fundamental entre Mi3 y Mi4 (3ª, 7ª, 9ª: color de jazz sin tapar la melodía)
    const CH = {
      Fmaj7: ['F2', 'A3 C4 E4'], Dm7: ['D2', 'F3 A3 C4'], Gm7: ['G2', 'F3 Bb3 D4'], C7: ['C3', 'E3 Bb3 D4'],
      D7: ['D2', 'F#3 C4 E4'], Bbmaj7: ['Bb2', 'F3 A3 D4'], Bbm6: ['Bb2', 'F3 G3 Db4'], Am7: ['A2', 'G3 C4 E4']
    };

                  'Bbmaj7', 'Bbm6', 'Am7', 'D7', 'Gm7', 'C7', 'Fmaj7 Dm7', 'Gm7 C7'];  // B: el iv menor le da el toque triste
    // melodía, un compás por línea: "tiempo-duración-nota"
    const MEL = [
      '1-1-A4 2-.5-C5 2.5-1.5-E5', '0-1.5-D5 1.5-.5-C5 2-2-A4', '.5-.5-Bb4 1-.5-D5 1.5-1.5-F5 3-1-E5', '0-1-D5 1-.5-C5 1.5-.5-Bb4 2-2-G4',
      '1-1-A4 2-.5-C5 2.5-1.5-F5', '0-1.5-F#5 1.5-.5-E5 2-1-D5 3-1-C5', '0-1.5-Bb4 1.5-.5-A4 2-2-G4', '.5-.5-G4 1-.5-Bb4 1.5-.5-D5 2-.5-E5 2.5-1.5-C5',
      '0-1.5-F5 1.5-.5-D5 2-2-A4', '0-1.5-F5 1.5-.5-Db5 2-2-Bb4', '.5-.5-C5 1-.5-E5 1.5-1.5-G5 3-1-E5', '0-1.5-F#5 1.5-.5-E5 2-2-D5',
      '0-1-Bb4 1-.5-D5 1.5-1-F5 2.5-1.5-A5', '0-1-G5 1-1-E5 2-1-C5 3-1-Bb4', '0-1.5-A4 1.5-.5-G4 2-2-F4', '2-.5-G4 2.5-.5-Bb4 3-1-C5'
    ].map(l => l.split(' ').map(s => { const [b, d, n] = s.split('-'); return [+b, +d, n]; }));

    // instrumentos y efectos fijos; devuelve la función que programa un compás (n) a partir del instante t0
    function synth(oc, dest) {
      const pulse = duty => {                                   // onda de pulso de consola (serie de Fourier)
        const n = 24, re = new Float32Array(n + 1), im = new Float32Array(n + 1);
        for (let k = 1; k <= n; k++) { re[k] = Math.sin(2 * Math.PI * k * duty) / (k * Math.PI); im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (k * Math.PI); }
        return oc.createPeriodicWave(re, im);

      const P50 = pulse(0.5), P25 = pulse(0.25);
      const bus = oc.createBiquadFilter(); bus.type = 'lowpass'; bus.frequency.value = 5000; bus.connect(dest);
      const lead = oc.createBiquadFilter(); lead.type = 'lowpass'; lead.frequency.value = 3200; lead.connect(bus);
      const comp = oc.createBiquadFilter(); comp.type = 'lowpass'; comp.frequency.value = 2200; comp.connect(bus);
      const vib = oc.createOscillator(), vibAmt = oc.createGain(); vib.frequency.value = 5.2; vibAmt.gain.value = 9; vib.connect(vibAmt); vib.start();
      const noise = oc.createBuffer(1, Math.round(oc.sampleRate / 5), oc.sampleRate), nd = noise.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      function tone(wave, f, t, dur, peak, dest, sus, rel, glide) {
        const o = oc.createOscillator(), g = oc.createGain();
        if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
        o.frequency.setValueAtTime(f, t);
        if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.008);
        g.gain.setTargetAtTime(peak * sus, t + 0.008, dur / 3);
        g.gain.setTargetAtTime(0, t + dur, rel / 3);
        o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + rel * 2);
        return o;
      }
      function hiss(t, dur, peak, freq) {                       // percusión de ruido
        const s = oc.createBufferSource(), f = oc.createBiquadFilter(), g = oc.createGain();
        s.buffer = noise; f.type = 'highpass'; f.frequency.value = freq;
        g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * 0.05); s.stop(t + dur + 0.01);
      }

      return (n, t0) => {
        const pass = Math.floor(n / 16), b = n % 16, chords = PROG[b].split(' '), at = s => t0 + sw(s);
        chords.forEach((name, h) => {                           // h = mitad del compás (2 acordes) o compás entero
          const [root, voicing] = CH[name], half = chords.length === 2, r = midi(root);

            .filter(([s]) => !half || (s >= b0 && s < b0 + 2))
            .forEach(([s, d, f]) => tone('triangle', f, at(s), gate(s, d, 0.04), 0.42, bus, 0.7, 0.04));

          (half ? [[b0, 1.1], [b0 + 1.5, 0.35]] : [[0, 1.1], [1.5, 0.8], [3, 0.7]]).forEach(([s, len], k) => voicing.split(' ').forEach((nt, v) =>
            tone(P25, hz(nt), at(s) + v * 0.012, span(s, len), k === 0 ? 0.06 : 0.045, comp, 0.35, 0.06)));
        });
        // melodía: la 2ª vuelta descansa en la parte A (solo ritmo), para que no canse
        if (pass === 0 || b >= 8) MEL[b].forEach(([s, d, nt]) => vibAmt.connect(tone(P50, hz(nt), at(s), gate(s, d, 0.04), 0.17, lead, 0.75, 0.04).detune));

        for (let e = 0; e < 8; e++) hiss(at(e / 2), e % 2 ? 0.06 : 0.035, e % 2 ? 0.05 : 0.028, 6000);
        [0, 2].forEach(s => tone('sine', 110, at(s), 0.13, 0.22, bus, 0.2, 0.05, 42));
        (n % 2 ? [1, 2.5] : [0, 1.5, 3]).forEach(s => tone(P25, 1650, at(s), 0.018, 0.035, bus, 0.3, 0.01));
      };
    }

    let player = null;
    function start() {
      const c = GameAudio.context;
      if (player || !c) return;                                // sin gesto del usuario todavía no hay audio
      const out = c.createGain(), t = c.currentTime;
      out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(LEVEL, t + 2.5); out.connect(GameAudio.music);
      const bar = synth(c, out);

        if (c.state !== 'running') return;

      out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t); out.gain.linearRampToValueAtTime(0, t + f);

  // iOS/Android exigen un gesto para el audio. La música se decide al acabar el gesto (no al pulsar):
  // si ese primer clic era NUEVO JUEGO, ya no estamos en el menú y no llega a sonar ni una nota

    GameAudio.init();

  }, { passive: true }));

  /* ---------- PARTIDA GUARDADA: una sola, en este navegador ----------

     "v" es la versión del formato: si el juego cambia y una partida vieja ya no encaja, se descarta. */
  const PDSave = (() => {

    function save(data) { try { localStorage.setItem(KEY, JSON.stringify(Object.assign({ v: V, ts: Date.now() }, data))); } catch (e) {} }

  const menu = $('menuButtons');

  }

  }

    if (opener && opener.focus) opener.focus();

  }
  function openSettings(from) {
    const focusEl = $('volume');
    if (current && current.id === 'newgame') {
      settingsStacked = true;
      $('settings').classList.add('open');

    if (e.target !== $(id)) return;
    if (id === 'settings') closeSettings(); else closeOverlay();
  }));
  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('mouseenter', () => GameAudio.hover());
    b.addEventListener('focus', () => GameAudio.hover());
    b.addEventListener('click', () => GameAudio.click());

  /* iconos intro: engranaje + menú */
  function paintIconBtn(btn, draw) {

    g.fillStyle = 'rgba(232,224,208,0.85)';
    g.fillRect(4, 0, 2, 2); g.fillRect(4, 8, 2, 2); g.fillRect(0, 4, 2, 2); g.fillRect(8, 4, 2, 2);
    g.fillRect(1, 1, 2, 2); g.fillRect(7, 1, 2, 2); g.fillRect(1, 7, 2, 2); g.fillRect(7, 7, 2, 2);
    g.fillRect(3, 3, 4, 4); g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(4, 4, 2, 2);

  paintIconBtn($('introMenu'), g => {                                 // casita / menú
    g.fillStyle = 'rgba(232,224,208,0.85)';
    g.fillRect(4, 1, 2, 1); g.fillRect(3, 2, 4, 1); g.fillRect(2, 3, 6, 1); g.fillRect(1, 4, 8, 1);
    g.fillRect(2, 5, 6, 4); g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(4, 7, 2, 2);
  });

  /* ---------- Nuevo juego / Continuar ---------- */
  // En el móvil la partida va en horizontal. Android: pantalla completa + bloqueo de la orientación (necesita el clic).
  // Donde no se puede (iPhone), el aviso #rotate tapa el juego hasta que se gira.
  function landscape(on) {

  function startNewGame() {

    openOverlay($('newgame'), $('introSettings'), $('btnNew'));

  }
  $('btnNew').addEventListener('click', () => {

  });
  $('confirmNewNo').addEventListener('click', closeOverlay);
  $('confirmNewYes').addEventListener('click', () => { $('confirmNew').classList.remove('open'); current = null; startNewGame(); });
  $('btnContinue').addEventListener('click', () => {

    openOverlay($('newgame'), $('introSettings'), $('btnContinue'));
    if (window.PDIntro) window.PDIntro.resume(s);
  });
  // CONTINUAR solo se ve si hay partida guardada; al aparecer o desaparecer, el menú se recoloca
  // (.WIP.): en la web (build) el juego en desarrollo sale bloqueado: solo la tragaperras. El botón de Ajustes lo
  // desbloquea (NUEVO JUEGO y CONTINUAR) y se recuerda en este navegador. En local (npm run dev) todo está abierto.
  const WEB_BUILD = false;                                  // scripts/build.mjs lo pone a true
  let wipOn = false; try { wipOn = localStorage.getItem('pd_wip') === '1'; } catch (e) {}
  const locked = () => WEB_BUILD && !wipOn;
  function refreshContinue() {
    const b = $('btnContinue'), has = PDSave.exists && !locked();
    if (b.hidden !== has) return;
    b.hidden = !has; applyLayout();
  }

    $('btnNew').hidden = locked();
    $('btnWip').setAttribute('aria-pressed', String(wipOn));
    renderPx($('wipState'), wipOn ? 'DESBLOQUEADO' : 'BLOQUEADO');
    refreshContinue(); applyLayout();
  }
  if (WEB_BUILD) {
    $('wipRow').hidden = false;
    $('btnWip').addEventListener('click', () => {
      wipOn = !wipOn; GameAudio.click();
      try { if (wipOn) localStorage.setItem('pd_wip', '1'); else localStorage.removeItem('pd_wip'); } catch (e) {}
      applyWip();
    });
    applyWip();
  }
  refreshContinue();
  $('introMenu').addEventListener('click', () => { GameAudio.click(); closeOverlay(); });
  $('introSettings').addEventListener('click', () => { GameAudio.click(); openSettings($('introSettings')); });
  $('hudPhone').addEventListener('click', () => openPhoneUI());
  $('phoneUIClose').addEventListener('click', () => { GameAudio.click(); powerOffPhone(); });
  $('phoneUI').addEventListener('pointerdown', e => { if (e.target === $('phoneUI')) powerOffPhone(); });

  /* ---------- Ajustes (volumen general y música) ---------- */
  // un deslizador con sus botones - / +; "beep" = pitido de prueba al moverlo (la música ya se oye sola en el menú)
  function volumeControl(ids, initial, set, beep) {
    const [slider, out, down, up] = ids.split(' ').map($);
    let lastTest = 0;
    const show = pct => { slider.value = pct; slider.style.setProperty('--pct', pct + '%'); renderPx(out, pct + '%'); };
    const apply = pct => {
      pct = Math.min(100, Math.max(0, Math.round(pct)));
      show(pct); GameAudio.init(); set(pct / 100);
      const n = performance.now();
      if (beep && n - lastTest > 110) { lastTest = n; GameAudio.test(); }

    show(Math.round(initial * 100));

  volumeControl('musicVol musicOut musDown musUp', GameAudio.musicVolume, v => GameAudio.setMusicVolume(v), false);
  $('btnSettings').addEventListener('click', () => openSettings($('btnSettings')));
  $('settingsClose').addEventListener('click', closeSettings);
  const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;      // iPhone no lo permite: se oculta
  if (!fsOK) $('fsRow').style.display = 'none';
  $('btnFull').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
  });

  /* ---------- Salir ---------- */
  $('btnExit').addEventListener('click', () => openOverlay($('confirm'), $('confirmNo'), $('btnExit')));
  $('confirmNo').addEventListener('click', closeOverlay);
  $('confirmYes').addEventListener('click', () => {
    $('confirm').classList.remove('open'); current = null;
    openOverlay($('bye'), $('byeBack'), $('btnExit'));
    try { window.close(); } catch (e) {}   // solo funciona si la pestaña la abrió un script; si no, queda la despedida
  });
  $('byeBack').addEventListener('click', closeOverlay);
})();

<script>
(() => {

  /* =====================================================================
     INTRODUCCIÓN: una sala vieja y vacía. El espejo refleja la luz y no deja ver nada.
     Entra desde negro, suena el viento y una voz dice la fecha mientras aparece letra a letra.

  const W = 320, H = 180;

  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

    const disc = (cx, cy, r, c, a) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (Math.hypot(x, y) <= r + 0.3) Pt(cx + x, cy + y, c, a); };
    const ring = (cx, cy, r, c, a) => { for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) if (Math.abs(Math.hypot(x, y) - r) < 0.6) Pt(cx + x, cy + y, c, a); };

    const blotch = (cx, cy, rx, ry, c, a, seed) => { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) { const d = (x * x) / (rx * rx) + (y * y) / (ry * ry) + (hash(x * 3.1 + y * 5.7 + seed) - 0.5) * 0.5; if (d < 1) Pt(cx + x, cy + y, c, a * (1 - d * 0.6)); } };

    for (let s = 1; s * 12 < W; s++) R(s * 12, CEIL, 1, RAIL - CEIL, '#5d4e2a', 0.3);

    }
    // envejecido: oscurece arriba, goteras, moho, manchas, desconchones y grietas
    for (let y = CEIL; y < CEIL + 36; y += 3) R(0, y, W, 3, '#000', 0.42 * (1 - (y - CEIL) / 36));
    [14, 62, 118, 175, 214, 258, 300].forEach((sx, i) => {

      R(sx - w0 - 1, CEIL + len, w0 * 2 + 3, 1, '#4a3814', 0.35);
    });

      const x = Math.pow(hash(i * 2.1), 2.4) * 64, y = CEIL + Math.pow(hash(i * 3.7), 2.4) * 44, col = hash(i * 9.1) > 0.5 ? '#26301e' : '#1c2416';
      Pt(x, y, col, 0.55); Pt(W - 1 - x * (0.9 + hash(i) * 0.2), y, col, 0.5);
    }

    band(24, 52, 0.28, 18); band(30, 40, 0.6, 18); band(36, 28, 0.75, 18);
    band(74, 16, 0.3, 18); band(78, 8, 0.85, 18);

      ctx.fillStyle = `rgba(255,255,255,${(i ? 1 - tw * 0.5 : tw) * pulse})`;

      const y = (hash(i * 3) * H + t * (1 + hash(i * 5) * 3)) % H;
      ctx.fillStyle = `rgba(255,236,200,${(0.18 + 0.25 * Math.abs(Math.sin(t * 1.4 + i))) * lvl})`;
      ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
    }
    ctx.restore();

    if (buzzing) drawPhoneVibe(jy, t);

    for (let i = 0; i < 240; i++) { ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.12)'; ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1); }
    if (hash(Math.floor(t * 24) * 1.7) > 0.975) { ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(Math.floor(hash(Math.floor(t * 24)) * W), 0, 1, H); }

    const lt = lineClock(t);

  // ---------- bocadillos de cómic del protagonista (uno detrás de otro) ----------
  // Al acabar el de "Voy a preguntarle a mi madre", el móvil empieza a vibrar hasta que el jugador lo abre.
  // then(t): lo que pasa cuando un bocadillo termina. Los de más adelante se añaden con say()
  const SAYS = [{ text: 'Vaya, qué momento para que se vaya la luz', hold: 3.2 },
    { text: 'Voy a preguntarle a mi madre', hold: 2.6, then: t => { startBuzz(t); if (window.PDPhone) window.PDPhone.allowMom(); } }];   // ya puede escribirle a su madre
  const SAYS_INTRO = SAYS.length;
  function say(text, hold, at, then) { if (sayI >= SAYS.length) sayNext = Math.max(sayNext, at); SAYS.push({ text, hold, then }); }
  // tamaño del píxel de la letra fina (bocadillos y avisos): lo más fino que se siga leyendo bien en esta pantalla
  function textK() { const r = cv.getBoundingClientRect(), screenPx = Math.min(r.width / W, r.height / H) / RES; return clamp(Math.ceil(1.4 / Math.max(0.01, screenPx)), 1, RES); }
  const SAY_AFTER = 1.2, SAY_DT = 0.045, SAY_GAP = 0.8;              // el primero, 1,2 s después del apagón
  let sayI = 0, sayNext = OUT_AT + SAY_AFTER, sayAt = null, sayLines = null;
  const phoneOpen = () => document.getElementById('phoneUI').classList.contains('open');
  function drawBubble(t) {
    const PD = window.PD; if (!PD || sayI >= SAYS.length || t < sayNext) return;
    const S = SAYS[sayI];
    if (sayAt == null) {                                             // si tiene el móvil abierto, espera a que lo cierre para hablar
      if (phoneOpen()) return;
      sayAt = t; sayLines = []; let cur = '';                        // en líneas de ~132 px para que quepa en la sala
      for (const w of PD.norm(S.text).split(' ')) { const test = cur ? cur + ' ' + w : w; if (cur && PD.measure(test) > 132) { sayLines.push(cur); cur = w; } else cur = test; }
      sayLines.push(cur);
    }
    const end = sayAt + S.text.length * SAY_DT + S.hold, a = 1 - clamp((t - end) / 0.5, 0, 1);
    if (a <= 0) {
      sayI++; sayAt = null; sayNext = Math.max(sayNext, t + SAY_GAP);
      if (S.then) S.then(t);
      return;
    }
    // Se dibuja en px reales del lienzo (×RES). k = tamaño de cada píxel de la letra: lo más fino que se siga leyendo bien
    const k = textK();
    const pad = 3 * k, lh = 9 * k, w = Math.max(...sayLines.map(l => PD.measure(l))) * k + pad * 2, h = sayLines.length * lh - 2 * k + pad * 2;
    const CW = W * RES, px = P.x * RES, head = (P.y - 18) * RES;
    const bx = clamp(Math.round(px - w / 2), 3, CW - w - 3), by = Math.max(3, Math.round(head - h - 4 * k));
    const tx = clamp(Math.round(px), bx + 3 * k, bx + w - 4 * k), ty = by + h;

    ctx.fillStyle = '#120c0a'; ctx.fillRect(bx - o, by, w + o * 2, h); ctx.fillRect(bx, by - o, w, h + o * 2);   // contorno con esquinas romas
    for (let i = 0; i < th + o; i++) { const hw = th + o - 1 - i; ctx.fillRect(tx - hw, ty + i, hw * 2 + 1, 1); }
    ctx.fillStyle = '#f4f0e6'; ctx.fillRect(bx, by, w, h);
    for (let i = 0; i < th; i++) { const hw = th - 1 - i; ctx.fillRect(tx - hw, ty + i, hw * 2 + 1, 1); }
    let left = Math.floor((t - sayAt) / SAY_DT) + 1;                  // aparece letra a letra
    sayLines.forEach((ln, i) => { if (left > 0) PD.drawText(ctx, ln.slice(0, left), bx + pad, by + pad + i * lh, '#1a1210', k); left -= ln.length + 1; });

  // ---------- el móvil vibra (icono que tiembla + zumbido) hasta que se abre ----------
  const BUZZ_EVERY = 1.8;
  let buzzNext = null;
  const hud = () => document.getElementById('hudPhone');
  function startBuzz(t) { buzzNext = t; hud().classList.add('buzzing'); }
  function stopBuzz() { buzzNext = null; hud().classList.remove('buzzing'); }
  function buzzTick(t) {

  // ---------- haz de la linterna, con los bordes difuminados ----------
  // Se pinta a resolución completa en una capa aparte: la luz baja con la distancia (degradado radial) y, además,
  // una máscara por ángulo la deja opaca en el centro y la va disolviendo hacia los lados, sin bordes marcados.
  const beamCv = document.createElement('canvas'); beamCv.width = W * RES; beamCv.height = H * RES;
  const bctx = beamCv.getContext('2d');
  // linterna de MÓVIL: un LED pequeño, luz blanca fría, abierta y floja, que alumbra cerca y no llega lejos
  const BEAM_LEN = 58, BEAM_HALF = 0.85;                             // alcance (px lógicos) y medio ángulo del haz (rad)
  const BEAM_PROFILE = [[0, 0], [0.14, 0.22], [0.32, 0.72], [0.5, 1], [0.68, 0.72], [0.86, 0.22], [1, 0]];
  function beamLayer(ox, oy, ang, fl) {
    const X = ox * RES, Y = oy * RES, L = BEAM_LEN * RES, box = [X - L, Y - L, L * 2, L * 2], conic = !!bctx.createConicGradient;
    bctx.clearRect(0, 0, beamCv.width, beamCv.height); bctx.save();
    // la luz no atraviesa las paredes: solo alumbra el suelo de la habitación y las paredes del fondo (que se ven de frente)
    bctx.beginPath(); room.lit.forEach(r => bctx.rect(r.x * RES, r.y * RES, r.w * RES, r.h * RES)); bctx.clip();
    if (!conic) { bctx.beginPath(); bctx.moveTo(X, Y); bctx.arc(X, Y, L, ang - BEAM_HALF * 0.7, ang + BEAM_HALF * 0.7); bctx.closePath(); bctx.clip(); }   // navegadores antiguos: cono sencillo

    rad.addColorStop(0.75, `rgba(232,240,255,${0.08 * fl})`); rad.addColorStop(1, 'rgba(232,240,255,0)');
    bctx.fillStyle = rad; bctx.fillRect(...box);
    const hx = X + Math.cos(ang) * 13 * RES, hy = Y + (Math.sin(ang) * 13 + 6) * RES;          // charco de luz justo delante, en el suelo
    const pool = bctx.createRadialGradient(hx, hy, 2 * RES, hx, hy, 24 * RES);
    pool.addColorStop(0, `rgba(240,246,255,${0.36 * fl})`); pool.addColorStop(0.5, `rgba(238,244,255,${0.14 * fl})`); pool.addColorStop(1, 'rgba(238,244,255,0)');
    bctx.fillStyle = pool; bctx.fillRect(hx - 24 * RES, hy - 24 * RES, 48 * RES, 48 * RES);
    const c = Math.cos(ang), s = Math.sin(ang);                                                // dónde choca el rayo central con la pared
    let d = inRects(room.floor, ox, oy) ? 0 : BEAM_LEN;                                       // (con la mano ya sobre la pared, sin círculo)
    while (d < BEAM_LEN && inRects(room.floor, ox + c * d, oy + s * d)) d += 1;               // se avanza hasta salir del suelo
    if (d < BEAM_LEN) {                                                                        // ahí la luz se queda y se concentra

      const sp = bctx.createRadialGradient(wx, wy, 0, wx, wy, R18);

    const R6 = 4 * RES, spot = bctx.createRadialGradient(X, Y, 0, X, Y, R6);                  // tampoco atraviesa la pared si está pegado a ella)
    spot.addColorStop(0, 'rgba(250,252,255,0.85)'); spot.addColorStop(1, 'rgba(250,252,255,0)');

  }

  const darkCv = document.createElement('canvas'); darkCv.width = W * RES; darkCv.height = H * RES;   // capa de oscuridad
  const dctx = darkCv.getContext('2d');
  // la claridad del ventanal de la sala entra por los cristales de la puerta doble: recorta la oscuridad de la entrada
  function hallReveal(t, lvl) {
    const DW = HALL_DEF.DOOR_W, sway = Math.sin(t * 0.5) * 2;

      lamp.addColorStop(0, `rgba(255,214,140,${0.3 * lvl * power})`); lamp.addColorStop(0.5, `rgba(255,200,120,${0.12 * lvl * power})`); lamp.addColorStop(1, 'rgba(255,200,120,0)');

  const FADE_IN = 1.6, TOUCH = matchMedia('(pointer: coarse)').matches;

  const poly = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); };
  function frame(now) {
    if (!running) return;
    const t = now / 1000 - t0, dt = Math.min(0.05, (now - last) / 1000); last = now;
    tNow = t; update(dt); doorCheck(t);
    const swapBlack = swapTick(t);
    const lvl = 0.94 + 0.06 * Math.sin(t * 1.6) - (hash(Math.floor(t * 18)) > 0.97 ? 0.25 : 0);

    ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.imageSmoothingEnabled = false;   // a partir de aquí, en px lógicos

    if (inSala) {                                                    // reflejo del espejo: la luz no deja ver nada dentro

      ctx.fillStyle = 'rgba(255,255,255,0.7)'; poly([[160 + sh, 14], [168 + sh, 14], [164 + sh, 22], [156 + sh, 22]]);

      if (a > 0) { ctx.fillStyle = `rgba(232,224,208,${a * 0.8})`; const mx = Math.round(mark.x), my = Math.round(mark.y); ctx.fillRect(mx - 3, my, 2, 1); ctx.fillRect(mx + 2, my, 2, 1); ctx.fillRect(mx, my - 2, 1, 1); ctx.fillRect(mx, my + 2, 1, 1); }

      if (front) { drawPlayer(cst); drawBox1(t, cst); } else { drawBox1(t, cst); drawPlayer(cst); }

    const beam = flashOn ? beamLayer(P.x + Math.cos(P.ang) * 5, P.y - 8 + Math.sin(P.ang) * 3, P.ang, 0.96 + 0.04 * Math.sin(t * 23)) : null;

      ctx.fillStyle = g; ctx.fillRect(sp.x - SPOT_R, sp.y - SPOT_R, SPOT_R * 2, SPOT_R * 2);

    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const showLights = !(cst && cst.bars > 0.3);                     // con el foco de circo encendido, nada más brilla

    else {
    // luz del día de fuera: claridad desde el ventanal que se apaga hacia el centro de la sala

    ctx.fillStyle = 'rgba(225,238,245,0.5)';                                                   // los cristales brillan: fuera es de día
    for (let k = 0; k < 4; k++) ctx.fillRect(WALL.x0 + 1, WIN.y + k * PANE + 1, WALL.t - 2, PANE - 2);

    const tvk = hash(Math.floor(t * 7)), cut = hash(Math.floor(t * 7) * 3.3) > 0.85;          // cambios de plano de la tele
    const tvA = (0.15 + 0.1 * tvk) * (cut ? 1.4 : 1) * power, tvC = cut ? '200,215,255' : '110,160,255';
