      const near = ctx.createLinearGradient(0, sy - 10, 0, sy); near.addColorStop(0, `rgba(${tvC},0)`); near.addColorStop(1, `rgba(${tvC},${tvA * 1.5})`);
      ctx.fillStyle = near; ctx.fillRect(sx0 - 2, sy - 10, sx1 - sx0 + 4, 10);
      ctx.fillStyle = `rgba(${tvC},${(0.5 + 0.4 * tvk) * power})`; ctx.fillRect(sx0 + 1, sy, sx1 - sx0 - 2, 1);
    }
    }
    if (beam && showLights) {                                                                  // linterna del móvil: tinte blanco frío, flojo, encima de lo recortado
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.28; ctx.drawImage(beam, 0, 0); ctx.restore();
    }
    for (let i = 0; i < 30; i++) {                                                             // polvo en el aire
      const x = (hash(i) * W + t * (2 + hash(i * 2) * 4) + Math.sin(t * 0.6 + i) * 3) % W, y = (hash(i * 3) * H + t * (1 + hash(i * 5) * 2)) % H;
      ctx.fillStyle = `rgba(255,236,200,${(0.15 + 0.2 * Math.abs(Math.sin(t * 1.4 + i))) * lvl})`; ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
    }
    ctx.restore();

    ctx.drawImage(vig, 0, 0);
    for (let i = 0; i < 120; i++) { ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.1)'; ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1); }
    drawBubble(t); buzzTick(t);
    // avisos de interacción: una etiqueta pequeña que sale del objeto (debajo; arriba van los bocadillos)
    if (nearBox1()) drawTag(box1Center().x, HALL_DEF.BOX1.fy + HALL_DEF.BOX1.d, TOUCH ? 'Toca para mover' : 'Mover caja');
    else if (nearFuse()) drawTag(HALL_DEF.FUSE.x + HALL_DEF.FUSE.w / 2, HALL_DEF.FUSE.y + HALL_DEF.FUSE.h, TOUCH ? 'Toca para abrir' : 'Abrir cuadro');
    if (panel) drawFusePanel(t);

    // ayuda de controles: se va al empezar a moverse
    if (moved && movedAt == null) movedAt = t;
    const helpA = clamp((t - FADE_IN) / 0.6, 0, 1) * (movedAt == null ? 1 : 1 - clamp((t - movedAt - 1.2) / 0.8, 0, 1));
    const PD = window.PD;
    if (helpA > 0 && PD && inSala) {
      const msg = PD.norm(TOUCH ? 'Usa el joystick para moverte' : 'Flechas o WASD para moverte'), w = PD.measure(msg);
      const hx = Math.round(194 - w / 2), hy = TV.y - 14;                                        // en el suelo libre, entre las sillas y la pared derecha
      ctx.globalAlpha = helpA * 0.75; ctx.fillStyle = '#000'; ctx.fillRect(hx - 4, hy - 2, w + 8, 11);
      ctx.globalAlpha = helpA; PD.drawText(ctx, msg, hx + 1, hy + 1, 'rgba(0,0,0,0.9)'); PD.drawText(ctx, msg, hx, hy, '#e8e0d0'); ctx.globalAlpha = 1;
    }

    if (cst) { const fc = cutFocus(); applyZoom(cst.zoom, fc.x, fc.y, cst.bars); }       // cámara de la mini escena
    const black = Math.max(1 - ease(clamp(t / FADE_IN, 0, 1)), swapBlack);   // entrada desde negro; fundido al cruzar una puerta
    if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
    raf = requestAnimationFrame(frame);
  }

  // opts.from === 'apagon': se continúa una partida guardada en el apagón (la luz ya se fue; vuelven los bocadillos)
  function start(opts) {
    if (!bg) build();
    const resumed = !!opts && opts.from === 'apagon', sp = resumed && opts.player;
    Object.assign(P, { x: 170, y: 74, dir: 'down', ang: Math.PI / 2, moving: false, phase: 0, tx: null, ty: null, stuck: 0 });   // junto al sofá, donde estaba el móvil
    room = SALA; swap = null;
    box1 = 'here'; cut = null; if (!HALL.solid.includes(HALL_BOX1)) HALL.solid.push(HALL_BOX1);
    panel = false; panelCloseAt = null; difUp = false; difTripAt = null; fuse = 'idle'; back = null; brkUp.forEach((_, i) => { brkUp[i] = i !== 9; });   // cuadro de luz como al principio         // la caja vuelve delante del cuadro de luz
    const spRoom = sp && sp.room === HALL.name ? HALL : SALA;                                   // la habitación en la que estaba (sala o entrada)
    if (sp && isFinite(sp.x) && isFinite(sp.y) && !blocked(sp.x, sp.y, spRoom)) {              // donde estaba al guardarse (si sigue siendo un sitio válido)
      room = spRoom;
      Object.assign(P, { x: sp.x, y: sp.y, dir: ['up', 'down', 'left', 'right'].includes(sp.dir) ? sp.dir : 'down', ang: isFinite(sp.ang) ? sp.ang : Math.PI / 2 });
    }
    flashOn = !!(window.PDPhone && window.PDPhone.flashlight);
    keys.clear(); mark = null; moved = false; movedAt = null; dragging = false;
    outAt = resumed ? -10 : OUT_AT; outFx = resumed ? 2 : 0; saved = resumed;
    SAYS.length = SAYS_INTRO; sayI = 0; sayNext = resumed ? FADE_IN + 1 : OUT_AT + SAY_AFTER; sayAt = null; stopBuzz();
    cv.hidden = false; running = true; joyEnd(); joyEl.hidden = !TOUCH;
    t0 = performance.now() / 1000; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; cancelAnimationFrame(raf); cv.hidden = true; keys.clear(); dragging = false; stopBuzz(); joyEnd(); joyEl.hidden = true; }
  window.PDRoom = { start, stop, get running() { return running; }, get player() { return { x: P.x, y: P.y, dir: P.dir, room: room.name }; } };
})();
</script>
