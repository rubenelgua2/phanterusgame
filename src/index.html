<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070304">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>phanteru's daemon</title>
<style>
  :root {
    --px: 3px;     /* tamaño de un "píxel" de la interfaz (lo ajusta el script, siempre entero) */
    --tpx: 3px;    /* tamaño de un píxel del título */
    --blood: #d10a0a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; width: 100%; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;                         /* sin scroll ni "rebote" en móvil */
    background: #070304; overflow: hidden; font-family: monospace;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

  #menu {
    position: relative;
    width: 100%; height: 100%; height: 100dvh;      /* dvh: respeta la barra del navegador móvil */
    display: flex; flex-direction: column;
    align-items: center;           /* centrado horizontal */
    justify-content: flex-start;   /* parte superior */
    padding-top: calc(5vh + env(safe-area-inset-top));
    overflow: hidden;
  }
  [data-layout=portrait] #menu { padding-top: calc(3dvh + env(safe-area-inset-top)); }

  /* ESCENA (detrás del título) */
  #scene {                                  /* el script fija tamaño y posición según el dispositivo */
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%; max-width: none;
    z-index: 0;
  }
  #scene { transform-origin: 0 0; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }   /* zoom a la máquina al jugar */
  /* si la escena no llega a un borde de la pantalla, se funde con el negro por ese lado */
  #scene.fade-y {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
  }
  #scene.fade-x {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
  }
  #scene.fade-x.fade-y {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 55%, transparent 38%, rgba(0,0,0,.88) 100%);
  }

  /* TÍTULO pixel art */
  .title { position: relative; z-index: 10; line-height: 0; font-size: 0; user-select: none; }
  #titleCanvas { display: block; }

  /* BOTONES pixel art (cada botón contiene dos canvas: normal y resaltado)
     Siempre centrados bajo la máquina; la altura exacta la fija el script (composición centrada) */
  .menu-buttons {
    position: absolute; z-index: 10;
    left: 50%; bottom: calc(4vh + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: calc(var(--px) * 4);
    width: max-content; max-width: 96vw;
  }
  /* móvil en vertical: botones en columna, fáciles de pulsar con el pulgar */
  [data-layout=portrait] .menu-buttons {
    flex-direction: column; align-items: center; flex-wrap: nowrap;
    bottom: calc(3dvh + env(safe-area-inset-bottom)); gap: calc(var(--px) * 3);
  }
  /* MINIJUEGO de la slot: fuera título y botones (en móvil tapaban las monedas), solo queda VOLVER en la esquina */
  .title, .menu-buttons, .slot-exit { transition: opacity .35s, visibility .35s; }
  #menu.slot-play .title, #menu.slot-play .menu-buttons { opacity: 0; visibility: hidden; }
  .slot-exit {
    position: absolute; z-index: 12; opacity: 0; visibility: hidden;
    top: calc(var(--px) * 4 + env(safe-area-inset-top)); right: calc(var(--px) * 4 + env(safe-area-inset-right));
  }
  #menu.slot-play .slot-exit { opacity: 1; visibility: visible; }

  .btn {
    background: none; border: 0; padding: 0; margin: 0;
    line-height: 0; font-size: 0; cursor: pointer;
    display: inline-block;
  }
  .btn canvas { display: block; }
  .btn .h { display: none; }
  .btn:focus-visible .n, .btn:active .n { display: none; }
  .btn:focus-visible .h, .btn:active .h { display: block; }
  @media (hover: hover) { .btn:hover .n { display: none; } .btn:hover .h { display: block; } }
  .btn:focus { outline: none; }
  .btn:active { transform: translateY(var(--px)); }

  /* texto pixel art genérico */
  .px { display: block; height: auto; max-width: 100%; margin: 0 auto; }

  /* VENTANAS */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .74);
    padding: max(4vw, env(safe-area-inset-top)) max(4vw, env(safe-area-inset-right)) max(4vw, env(safe-area-inset-bottom)) max(4vw, env(safe-area-inset-left));
    overflow-y: auto;
  }
  .overlay.open { display: flex; animation: fadein .2s steps(4, end); }
  .overlay.solid { background: #000; flex-direction: column; text-align: center; gap: calc(var(--px) * 6); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .panel {
    width: min(92vw, calc(var(--px) * 150)); margin: auto;
    background: #0d0405;
    border: calc(var(--px) * 2) solid #5a0000;
    box-shadow: inset 0 0 0 var(--px) #1a0507;
    padding: calc(var(--px) * 7) calc(var(--px) * 8) calc(var(--px) * 8);
    text-align: center;
    /* esquinas "escalonadas" estilo pixel art */
    clip-path: polygon(
      var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
      100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%,
      var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px));
  }
  .panel h2 { margin-bottom: calc(var(--px) * 6); line-height: 0; font-size: 0; }
  .row-actions { display: flex; justify-content: center; gap: calc(var(--px) * 4); margin-top: calc(var(--px) * 7); flex-wrap: wrap; }
  .vol-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: calc(var(--px) * 3); line-height: 0; font-size: 0; }
  .vol-label .px { margin: 0; }
  .vol-row { display: flex; align-items: center; gap: calc(var(--px) * 3); }

  /* slider */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; min-width: 0; height: calc(var(--px) * 8);
    background: transparent; cursor: pointer; margin: 0; --pct: 70%;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    box-sizing: content-box; height: calc(var(--px) * 4); border: var(--px) solid #5a0000; border-radius: 0;
    background: linear-gradient(90deg, #d10a0a var(--pct), #1a0507 var(--pct));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; box-sizing: border-box;
    width: calc(var(--px) * 4); height: calc(var(--px) * 8); margin-top: calc(var(--px) * -2);
    background: #ff5a4a; border: var(--px) solid #070102; border-radius: 0;
  }
  input[type=range]::-moz-range-track { height: calc(var(--px) * 4); border: var(--px) solid #5a0000; border-radius: 0; background: #1a0507; }
  input[type=range]::-moz-range-progress { height: calc(var(--px) * 4); background: #d10a0a; }
  input[type=range]::-moz-range-thumb {
    box-sizing: border-box; width: calc(var(--px) * 4); height: calc(var(--px) * 8);
    background: #ff5a4a; border: var(--px) solid #070102; border-radius: 0;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { background: #fff; }
  input[type=range]:focus-visible::-moz-range-thumb { background: #fff; }
  @media (pointer: coarse) {                      /* deslizador más grande para el dedo */
    input[type=range] { height: calc(var(--px) * 14); }
    input[type=range]::-webkit-slider-thumb { width: calc(var(--px) * 6); height: calc(var(--px) * 12); margin-top: calc(var(--px) * -4); }
    input[type=range]::-moz-range-thumb { width: calc(var(--px) * 6); height: calc(var(--px) * 12); }
  }

  /* INTRO (nueva partida) */
  #newgame { padding: 0; background: #000; }
  #settings { z-index: 60; }   /* ajustes por encima de la intro */
  #introCanvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  [data-layout=portrait] #introCanvas { top: 50%; height: auto; transform: translateY(-50%); object-fit: contain; }   /* formato cine en vertical */
  .intro-top {
    position: absolute; z-index: 3; top: calc(var(--px) * 3 + env(safe-area-inset-top));
    right: calc(var(--px) * 3 + env(safe-area-inset-right));
    display: flex; gap: calc(var(--px) * 2); align-items: center;
  }
  .intro-icon-btn {
    background: rgba(0, 0, 0, .42); border: calc(var(--px) * 0.5) solid rgba(232, 224, 208, .28);
    padding: calc(var(--px) * 1.5); margin: 0; cursor: pointer; line-height: 0; font-size: 0;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .intro-icon-btn:focus { outline: none; }
  .intro-icon-btn:focus-visible { border-color: rgba(255, 90, 74, .7); }
  .intro-icon-btn:active { transform: translateY(1px); opacity: .85; }
  .intro-icon-btn canvas { display: block; width: calc(10 * var(--px)); height: calc(10 * var(--px)); }
  .intro-sub {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--px) * 16 + env(safe-area-inset-bottom)); z-index: 2;
    cursor: pointer; max-width: 96vw; background: none; border: 0; padding: 0; line-height: 0;
  }
  .intro-sub[hidden] { display: none !important; }
  .intro-hud-phone {
    position: absolute; z-index: 3;
    right: calc(var(--px) * 4 + env(safe-area-inset-right));
    bottom: calc(var(--px) * 4 + env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, .35); border: calc(var(--px) * 0.5) solid rgba(232, 224, 208, .22);
    padding: calc(var(--px) * 1.5); line-height: 0;
  }
  .intro-hud-phone canvas { display: block; width: calc(12 * var(--px)); height: calc(18 * var(--px)); }
  /* ventana estática del smartphone (UI) */
  #phoneUI {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: calc(var(--px) * 4);
    background: rgba(0, 0, 0, .55);
    padding: max(3vw, env(safe-area-inset-top)) max(3vw, env(safe-area-inset-right)) max(3vw, env(safe-area-inset-bottom)) max(3vw, env(safe-area-inset-left));
  }
  #phoneUI.open { display: flex; animation: fadein .15s steps(3, end); }
  .phone-device {
    position: relative; line-height: 0;
    filter: drop-shadow(0 calc(var(--px) * 2) 0 rgba(0,0,0,.55)) drop-shadow(0 calc(var(--px) * 6) calc(var(--px) * 10) rgba(0,0,0,.45));
  }
  #phoneUICanvas {
    display: block;
    height: min(68dvh, calc(100dvh - 5rem), calc(240 * var(--px)));
    width: auto;
    aspect-ratio: 240 / 480;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: default;
  }
  /* Interruptor izquierdo del chasis → apagar móvil */
  .phone-side-btn {
    position: absolute; left: 0; top: 24%;
    width: calc(var(--px) * 3.5); height: calc(var(--px) * 12);
    padding: 0; margin: 0; cursor: pointer; z-index: 1;
    background: transparent; border: 0;
  }
  .phone-side-btn:focus { outline: none; }
  .phone-side-btn:focus-visible { outline: calc(var(--px) * 0.5) solid rgba(255, 90, 74, .7); outline-offset: calc(var(--px) * 0.5); }
  .phone-side-btn:active { filter: brightness(1.15); }

  @media (prefers-reduced-motion: reduce) { .overlay.open { animation: none; } #phoneUI.open { animation: none; } #scene { transition: none; } }
</style>
</head>
<body>
  <main id="menu">
    <canvas id="scene" width="320" height="180"></canvas>
    <div class="vignette"></div>

    <h1 class="title"><canvas id="titleCanvas" role="img" aria-label="phanteru's daemon"></canvas></h1>

    <nav class="menu-buttons" id="menuButtons" aria-label="Menú principal">
      <button class="btn" id="btnNew" type="button" data-label="NUEVO JUEGO" aria-label="Nuevo juego"></button>
      <button class="btn" id="btnSettings" type="button" data-label="AJUSTES" aria-label="Ajustes"></button>
      <button class="btn" id="btnExit" type="button" data-label="SALIR" aria-label="Salir"></button>
    </nav>
    <button class="btn slot-exit" id="slotExit" type="button" data-label="VOLVER" aria-label="Dejar la tragaperras"></button>
  </main>

  <!-- Ajustes -->
  <div class="overlay" id="settings" role="dialog" aria-modal="true" aria-label="Ajustes">
    <div class="panel">
      <h2 data-px="AJUSTES" data-scale="2" data-color="#d10a0a"></h2>
      <div class="vol-label">
        <span data-px="VOLUMEN GENERAL" data-color="#c9b8b8"></span>
        <span id="volumeOut" data-px="70%" data-color="#ff5a4a"></span>
      </div>
      <div class="vol-row">
        <button class="btn" id="volDown" type="button" data-label="-" aria-label="Bajar volumen"></button>
        <input type="range" id="volume" min="0" max="100" step="1" value="70" aria-label="Volumen general">
        <button class="btn" id="volUp" type="button" data-label="+" aria-label="Subir volumen"></button>
      </div>
      <div class="row-actions" id="fsRow" style="margin-top: calc(var(--px) * 5)"><button class="btn" id="btnFull" type="button" data-label="PANTALLA COMPLETA" aria-label="Pantalla completa"></button></div>
      <div class="row-actions" style="margin-top: calc(var(--px) * 4)"><button class="btn" id="settingsClose" type="button" data-label="VOLVER" aria-label="Volver"></button></div>
    </div>
  </div>

  <!-- Confirmar salida -->
  <div class="overlay" id="confirm" role="dialog" aria-modal="true" aria-label="¿Salir?">
    <div class="panel">
      <h2 data-px="¿SALIR?" data-scale="2" data-color="#d10a0a"></h2>
      <div class="row-actions" style="margin-top:0">
        <button class="btn" id="confirmYes" type="button" data-label="SI" aria-label="Sí"></button>
        <button class="btn" id="confirmNo" type="button" data-label="NO" aria-label="No"></button>
      </div>
    </div>
  </div>

  <!-- Nueva partida: introducción (sala vacía, viento y fecha) -->
  <div class="overlay" id="newgame" role="dialog" aria-modal="true" aria-label="Nueva partida">
    <canvas id="introCanvas" role="img" aria-label="Una sala vieja y vacía; la luz se refleja en el espejo"></canvas>
    <button type="button" class="intro-sub" id="introSubBtn" aria-label="Saltar diálogo" hidden>
      <canvas id="introSub" role="img" aria-label="Subtítulo"></canvas>
    </button>
    <div class="intro-top">
      <button type="button" class="intro-icon-btn" id="introSettings" aria-label="Ajustes"></button>
      <button type="button" class="intro-icon-btn" id="introMenu" aria-label="Menú principal"></button>
    </div>
    <button class="btn intro-hud-phone" id="hudPhone" type="button" aria-label="Abrir teléfono" hidden></button>
    <div id="phoneUI" role="dialog" aria-modal="true" aria-label="Teléfono">
      <div class="phone-device">
        <canvas id="phoneUICanvas" width="240" height="480" role="img" aria-label="Pantalla del teléfono"></canvas>
        <button type="button" class="phone-side-btn" id="phoneUIClose" aria-label="Apagar teléfono" title="Apagar"></button>
      </div>
    </div>
  </div>

  <!-- Despedida -->
  <div class="overlay solid" id="bye" role="dialog" aria-modal="true" aria-label="Hasta pronto">
    <span data-px="HASTA PRONTO..." data-scale="3" data-color="#d10a0a"></span>
    <span data-px="YA PUEDES CERRAR ESTA VENTANA." data-color="#a89090"></span>
    <button class="btn" id="byeBack" type="button" data-label="VOLVER AL MENU" aria-label="Volver al menú"></button>
  </div>

<script>

(() => {
  'use strict';
  const W = 320, H = 180;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const WALL_BASE = 140;   // donde acaba la pared y empieza el suelo
  const G = 152;           // línea del suelo donde se apoyan los objetos

  // ---------- utilidades ----------
  const R = Math.round;
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(R(x), R(y), R(w), R(h)); }
  const r = (x, y, w, h, col) => rect(ctx, x, y, w, h, col);
  function line(x0, y0, x1, y1, col, th) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) || 1;
    for (let i = 0; i <= n; i++) r(x0 + dx * i / n, y0 + dy * i / n, th, th, col);
  }
  function glow(c, cx, cy, rad, rgb, a) {
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g;
    c.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  // ---------- sprites por filas de texto (con contorno automático) ----------
  const PAL = { r:'#c40e0e', R:'#ff4545', w:'#d9d2bf', g:'#2f8f3a', k:'#150506',
                y:'#d6a81c', Y:'#ffe27a', b:'#6b4416' };
  function makeSprite(rows) {
    const h = rows.length, w = rows[0].length;
    const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
    const x = c.getContext('2d');
    const f = (i, j) => i >= 0 && j >= 0 && i < h && j < w && rows[i][j] !== '.';
    for (let i = -1; i <= h; i++) for (let j = -1; j <= w; j++) {
      if (f(i, j)) { x.fillStyle = PAL[rows[i][j]]; x.fillRect(j + 1, i + 1, 1, 1); }
      else if (f(i-1, j) || f(i+1, j) || f(i, j-1) || f(i, j+1)) { x.fillStyle = PAL.k; x.fillRect(j + 1, i + 1, 1, 1); }
    }
    return c;
  }
  const SEVEN = makeSprite([
    '########','########','......##','.....##.','.....##.','....##..',
    '....##..','...##...','...##...','..##....','..##....'
  ].map((s, i) => s.replace(/#/g, i < 2 ? 'R' : 'r')));
  const CHERRY = makeSprite([
    '.......gg...','......g.g...','.....g...g..','....g....g..',
    '..rrr...rrr.','.rrrrr.rrrrr','.rRrrr.rRrrr','.rrrrr.rrrrr','..rrr...rrr.'
  ]);
  const BAR = makeSprite([
    'YYYYYYYYYYYY','yyyyyyyyyyyy','yykkyykkyykk','yykkyykkyykk','yyyyyyyyyyyy','bbbbbbbbbbbb'
  ]);
  const BELL = makeSprite([
    '....yy....','...yYYy...','..yYYyyy..','..yYyyyy..','..yYyyyy..',
    '.yYyyyyyy.','.yYyyyyyy.','yyyyyyyyyy','bbbbbbbbbb','....bb....'
  ]);
  const SKULL = makeSprite([
    '..wwwwww..','.wwwwwwww.','wwwwwwwwww','wwkkwwkkww','wwkkwwkkww',
    'wwwwkkwwww','.wwwwwwww.','..wkwkwk..','..wkwkwk..'
  ]);
  const STRIP = [SEVEN, CHERRY, SKULL, BAR, BELL, SKULL, CHERRY, BELL, SKULL, BAR]; // índice 0 = 7
  const N = STRIP.length;
  function drawSpriteC(spr, cx, cy, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.drawImage(spr, R(cx - spr.width / 2), R(cy - spr.height / 2));
    ctx.globalAlpha = 1;
  }

  // ---------- capa estática: pared, suelo y cajas de mudanza ----------
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const bx = bg.getContext('2d');
  const rb = (x, y, w, h, c) => rect(bx, x, y, w, h, c);

  // pared con papel pintado desgastado
  rb(0, 0, W, WALL_BASE, '#130708');
  for (let x = 0; x < W; x += 10) {
    rb(x, 0, 5, WALL_BASE, '#170909');
    rb(x + 5, 0, 1, WALL_BASE, '#0e0506');
  }
  for (let i = 0; i < 180; i++) {            // manchas de humedad
    rb(hash(i) * W, hash(i + 90) * WALL_BASE, 1 + hash(i + 7) * 3, 1, '#0d0505');
  }
  rb(0, WALL_BASE - 6, W, 6, '#1f0f10');      // rodapié
  rb(0, WALL_BASE - 6, W, 1, '#2d1718');
  // suelo de tablas
  for (let y = WALL_BASE, k = 0; y < H; y += 6, k++) {
    rb(0, y, W, 6, k % 2 ? '#1b1010' : '#170d0d');
    rb(0, y, W, 1, '#0c0606');
    const off = (k * 37) % 53;
    for (let x = off; x < W; x += 53) rb(x, y, 1, 6, '#0c0606');
  }

  // cajas de mudanza
  const COL = ['#8b5f34', '#7d5430', '#946a3c'];
  function box(x, yTop, w, h, v) {
    const base = COL[v % 3];
    rb(x, yTop, w, h, '#2a170a');
    rb(x + 1, yTop + 1, w - 2, h - 2, base);

  }
  const BOXES = [
    // izquierda
    [8, G-32, 38, 32, 0], [14, G-58, 30, 26, 1], [58, G-24, 30, 24, 2], [62, G-42, 22, 18, 0], [92, G-16, 24, 16, 1],
    // derecha
    [214, G-16, 24, 16, 2], [242, G-28, 30, 28, 1], [246, G-46, 22, 18, 0], [276, G-34, 34, 34, 0], [280, G-56, 26, 22, 2],
  ];
  // sombras en el suelo
  BOXES.forEach(([x, , w]) => { bx.fillStyle = 'rgba(0,0,0,.45)'; bx.fillRect(x - 2, G - 1, w + 5, 4); });
  BOXES.forEach(b => box(...[b[0], b[1], b[2], b[3], b[4]]));
  // oscurecer todo (el ambiente es oscuro; la máquina es la luz)
  bx.fillStyle = 'rgba(0,0,0,.42)'; bx.fillRect(0, 0, W, H);

  // ---------- la tragaperras ----------
  const MX = 122, MY = 52;           // esquina superior izquierda de la máquina
  const SPEED = 16;                  // celdas por segundo
  const STOP = [2.0, 2.7, 3.4];      // cuándo se detiene cada rodillo
  const g = tau => tau < 0.3 ? 0.5 * tau * tau / 0.3 : tau - 0.15;   // aceleración inicial
  const reels = STOP.map(stopT => {
    const p0 = SPEED * g(stopT - 0.5);
    const target = (Math.floor(p0 / N) + 2) * N;   // siempre acaba en un 7
    const dist = target - p0, dur = 2 * dist / SPEED;
    return { stopT, p0, target, dur, finish: stopT + dur };
  });
  const WIN_START = Math.max(...reels.map(q => q.finish)) + 0.15;
  const WIN_END = WIN_START + 2.2;
  const CYCLE = WIN_END + 0.8;
  function reelPos(q, t) {
    if (t < 0.5) return 0;
    if (t < q.stopT) return SPEED * g(t - 0.5);
    if (t < q.finish) { const u = (t - q.stopT) / q.dur; return q.p0 + (q.target - q.p0) * (1 - (1 - u) * (1 - u)); }
    return q.target;
  }
  const ease = u => u * u * (3 - 2 * u);

  function leverPos(t) {
    if (t < 0.2) return 0;
    if (t < 0.55) return ease((t - 0.2) / 0.35);
    if (t < 0.7) return 1;
    if (t < 1.3) return 1 - ease((t - 0.7) / 0.6);

  }

  const WIN_X = [MX + 11, MX + 30, MX + 49], WIN_Y = MY + 32, WIN_W = 17, WIN_H = 26, CELL = 16;

  // dígitos minúsculos 3x5 para la pantalla LED de créditos
  const MINI = {
    '0':'XXX|X.X|X.X|X.X|XXX','1':'.X.|XX.|.X.|.X.|XXX','2':'XXX|..X|XXX|X..|XXX','3':'XXX|..X|XXX|..X|XXX',
    '4':'X.X|X.X|XXX|..X|..X','5':'XXX|X..|XXX|..X|XXX','6':'XXX|X..|XXX|X.X|XXX','7':'XXX|..X|..X|..X|..X',
    '8':'XXX|X.X|XXX|X.X|XXX','9':'XXX|X.X|XXX|..X|XXX'
  };
  function drawMini(str, rightX, y, col) {
    let x = rightX - (str.length * 4 - 1);
    for (const ch of str) {
      MINI[ch].split('|').forEach((row, ry) => { for (let i = 0; i < 3; i++) if (row[i] === 'X') r(x + i, y + ry, 1, 1, col); });
      x += 4;
    }
  }

  // v = estado visual: { spinning, winning, leverP, reel(i)->{pos,spd}, led, header, green, slotGlow }
  function drawMachine(t, v) {
    const spinning = v.spinning, winning = v.winning;
    // cuerpo
    r(MX - 1, MY - 1, 78, 102, '#0d0304');
    r(MX, MY, 76, 100, '#43100f');
    r(MX, MY, 3, 100, '#6a1c1a');            // luz en el borde izquierdo
    r(MX + 73, MY, 3, 100, '#240808');       // sombra derecha
    r(MX + 36, MY, 2, 100, '#4a1312');       // brillo vertical
    r(MX, MY + 96, 76, 4, '#1a0607');        // base

    // cabecera: tres 7 o mensajes del juego
    r(MX + 5, MY + 5, 66, 22, '#6b5014');
    r(MX + 6, MY + 6, 64, 20, '#1a0505');
    const PD = window.PD;
    if (v.header && PD) {
      if (v.header.on) {
        const lines = v.header.lines.map(PD.norm), total = lines.length * 7 + (lines.length - 1) * 2;
        const y0 = MY + 6 + Math.floor((20 - total) / 2);
        lines.forEach((ln, i) => PD.drawText(ctx, ln, MX + 6 + Math.floor((64 - PD.measure(ln)) / 2), y0 + i * 9, v.header.color));
      }
    } else {
      const sevAlpha = winning ? (Math.floor(t * 8) % 2 ? 1 : 0.55) : 0.3;
      for (let i = 0; i < 3; i++) drawSpriteC(SEVEN, MX + 22 + i * 16, MY + 16, sevAlpha);
    }

    // bombillas del marco
    const chase = winning ? 9 : spinning ? 7 : 2;
    for (let i = 0; i < 9; i++) {
      const on = winning ? ((i + Math.floor(t * chase)) % 2 === 0) : ((i + Math.floor(t * chase)) % 3 === 0);
      const col = on ? (winning && i % 2 ? '#ff3a3a' : '#ffd23a') : '#4a3a10';
      r(MX + 6 + i * 7, MY + 2, 3, 2, col);
      r(MX + 6 + i * 7, MY + 28, 3, 2, col);
    }

    // marco y rodillos
    const flashA = winning && Math.floor(t * 10) % 2 === 0;
    r(MX + 8, MY + 30, 60, 32, '#6b5014');
    r(MX + 9, MY + 31, 58, 30, flashA ? '#ffe27a' : '#b8922a');
    r(MX + 9, MY + 31, 58, 1, '#f0d060');
    for (let i = 0; i < 3; i++) {
      const x = WIN_X[i], { pos, spd } = v.reel(i);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, WIN_Y, WIN_W, WIN_H); ctx.clip();
      r(x, WIN_Y, WIN_W, WIN_H, '#a8977a');
      const cy0 = WIN_Y + WIN_H / 2;
      for (let k = Math.floor(pos) - 2; k <= Math.floor(pos) + 2; k++) {
        const spr = STRIP[((k % N) + N) % N];
        const cy = cy0 + (pos - k) * CELL;
        if (spd > 10) { drawSpriteC(spr, x + WIN_W / 2, cy - 4, 0.35); drawSpriteC(spr, x + WIN_W / 2, cy + 4, 0.35); }
        drawSpriteC(spr, x + WIN_W / 2, cy, spd > 10 ? 0.75 : 1);
      }
      // sombreado cilíndrico
      [[0, .6], [1, .38], [2, .2], [3, .08]].forEach(([d, a]) => {
        r(x, WIN_Y + d, WIN_W, 1, `rgba(0,0,0,${a})`);
        r(x, WIN_Y + WIN_H - 1 - d, WIN_W, 1, `rgba(0,0,0,${a})`);
      });
      ctx.restore();
    }
    if (winning && Math.floor(t * 6) % 2 === 0) r(MX + 10, WIN_Y + WIN_H / 2, 56, 1, '#ff3030');   // línea de premio

    // panel de botones (el verde es el secreto)
    r(MX + 8, MY + 66, 60, 16, '#240808'); r(MX + 8, MY + 66, 60, 1, '#6a1c1a');
    const bl = winning ? (Math.floor(t * 8) % 2) : 0;
    r(MX + 14, MY + 70, 6, 6, '#0d0304'); r(MX + 15, MY + 71, 4, 4, bl ? '#ff5050' : '#a01212');
    r(MX + 26, MY + 70, 6, 6, '#0d0304'); r(MX + 27, MY + 71, 4, 4, bl ? '#a01212' : '#e0b020');
    r(MX + 38, MY + 70, 6, 6, '#0d0304'); r(MX + 39, MY + 71, 4, 4, v.green);
    r(MX + 49, MY + 69, 15, 8, '#0d0304');                                  // pantalla LED
    if (v.led != null) drawMini(v.led.text, MX + 62, MY + 71, v.led.color);
    else for (let i = 0; i < 3; i++) r(MX + 51 + i * 4, MY + 71, 3, 4, winning ? '#ff3030' : '#4a0c0c');

    // ranura de monedas y bandeja
    if (v.slotGlow) { ctx.globalAlpha = 0.22 + 0.12 * Math.sin(t * 12); r(MX + 27, MY + 82, 22, 9, '#ffe27a'); ctx.globalAlpha = 1; }
    r(MX + 30, MY + 86, 16, 3, '#0d0304');
    r(MX + 32, MY + 87, 12, 1, v.slotGlow && Math.floor(t * 6) % 2 ? '#ffe27a' : '#c9a227');
    r(MX + 22, MY + 92, 32, 6, '#0d0304'); r(MX + 23, MY + 93, 30, 4, '#1c0809');

    // palanca
    const p = v.leverP;
    const px = MX + 76, py = MY + 44;
    const ux = MX + 85, uy = MY + 14, dx = MX + 85, dy = MY + 64;
    const bx2 = ux + (dx - ux) * p, by2 = uy + (dy - uy) * p;
    r(px - 1, py - 4, 5, 10, '#2a2a30');

    line(px + 2, py, bx2 + 2, by2 + 2, '#9aa0a8', 2);

  }

  // ---------- partículas de polvo ----------
  const dust = Array.from({ length: 28 }, (_, i) => ({
    x: hash(i) * W, y: hash(i + 40) * H, vx: (hash(i + 80) - 0.5) * 3, vy: -1 - hash(i + 120) * 2, ph: hash(i + 160) * 6
  }));

  // =====================================================================
  //  MINIJUEGO SECRETO: botón verde de la tragaperras
  //  3 monedas -> arrástralas a la ranura -> palanca -> premio al azar
  // =====================================================================
  const COIN = makeSprite([
    '..yyy..', '.yYYyy.', 'yYyyyyb', 'yyyyyyb', 'yyyyybb', '.yybbb.', '..bbb..'
  ]);
  const SYMID = [0, 1, 3, 2, 4, 3, 1, 4, 3, 2];          // 0=siete 1=cereza 2=BAR 3=calavera 4=campana (misma tira que STRIP)
  const PAY3 = { 0: 100, 2: 20, 4: 15, 1: 10, 3: 5 };    // premio por tres iguales
  function evaluate(idx) {
    const ids = idx.map(i => SYMID[i]);
    if (ids[0] === ids[1] && ids[1] === ids[2]) return { amount: PAY3[ids[0]], id: ids[0], three: true };
    const c = ids.filter(x => x === 1).length;
    if (c === 2) return { amount: 2 };                    // dos cerezas (donde sea)
    if (ids[0] === 1) return { amount: 1 };               // una cereza en el primer rodillo
    return { amount: 0 };
  }

  const nowS = () => performance.now() / 1000;
  const snd = (name, ...a) => { const A = window.GameAudio; if (A && A[name]) A[name](...a); };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const TP = matchMedia('(pointer: coarse)').matches ? 4 : 0;       // margen extra de toque en móvil
  const buzz = p => { if (TP && navigator.vibrate) try { navigator.vibrate(p); } catch (_) {} };   // vibración en móvil (Android)
  const GREEN = { x: MX + 36 - TP, y: MY + 68 - TP, w: 10 + 2 * TP, h: 10 + 2 * TP };
  const SLOT = { x: MX + 26 - TP, y: MY + 78 - TP, w: 24 + 2 * TP, h: 12 + TP };
  const SLOTX = MX + 38, SLOTY = MY + 81, SLOT_TOP = MY + 87;
  const inRect = (p, q) => p.x >= q.x && p.x <= q.x + q.w && p.y >= q.y && p.y <= q.y + q.h;

  let mode = 'attract';              // 'attract' (la slot va sola) | 'play'
  let attractStart = 0, hoverGreen = false;
  const play = { coins: [], drag: null, recs: [], parts: [], credits: 0, state: 'idle', lever0: -99, stopped: [true, true, true], win: null, result: null, until: 0, nextTick: 0 };
  const attractT = ts => (ts - attractStart) % CYCLE;

  // movimiento de un rodillo en una tirada concreta
  function makeSpinRec(startPos, T0, i, idx) {
    const spinStart = T0 + 0.3, stopT = T0 + 1.1 + i * 0.55;
    const p0 = startPos + SPEED * g(stopT - spinStart);
    const base = Math.ceil(p0) + 3;
    const target = base + (((idx - base) % N) + N) % N;       // siempre cae en el símbolo elegido
    const dur = 2 * (target - p0) / SPEED;
    return { startPos, spinStart, stopT, p0, target, dur, finish: stopT + dur };
  }
  function makeSettleRec(startPos, T0, toSeven) {              // frena suavemente a una posición limpia
    const target = toSeven ? Math.ceil(startPos / N) * N : Math.ceil(startPos);
    const dur = Math.max(0.3, 2 * (target - startPos) / SPEED);
    return { startPos, spinStart: T0, stopT: T0, p0: startPos, target, dur, finish: T0 + dur };
  }
  function recPos(q, t) {
    if (t < q.spinStart) return q.startPos;
    if (t < q.stopT) return q.startPos + SPEED * g(t - q.spinStart);
    if (t < q.finish) { const u = (t - q.stopT) / q.dur; return q.p0 + (q.target - q.p0) * (1 - (1 - u) * (1 - u)); }
    return q.target;
  }
  const lastFinish = () => Math.max(...play.recs.map(q => q.finish));

  function startPlay(ts) {
    const ta = attractT(ts);
    play.recs = reels.map(q => makeSettleRec(reelPos(q, ta) % N, ts, false));
    Object.assign(play, { credits: 0, state: 'idle', lever0: -99, win: null, result: null, parts: [], drag: null, stopped: [true, true, true] });
    play.coins = [0, 1, 2].map(i => ({ home: { x: MX + 28 + i * 10, y: MY + 95 }, x: MX + 38, y: MY + 95, state: 'pop', t0: ts + 0.35 + i * 0.22, dropped: false }));
    mode = 'play'; setFocus(true);
  }
  function endPlay(ts) {
    if (mode !== 'play' || play.state === 'closing') return;
    play.recs = play.recs.map(q => makeSettleRec(recPos(q, ts) % N, ts, true));
    Object.assign(play, { coins: [], drag: null, state: 'closing', credits: 0, win: null, parts: [] });
    setFocus(false);
  }
  const canPull = ts => mode === 'play' && play.state === 'idle' && play.credits > 0 && ts >= lastFinish();
  function pull(ts) {
    const idx = [0, 1, 2].map(() => Math.floor(Math.random() * N));   // resultado 100% aleatorio
    play.credits--; play.lever0 = ts; play.state = 'spinning'; play.nextTick = ts + 0.3; play.stopped = [false, false, false];
    play.result = { idx };
    play.recs = play.recs.map((q, i) => makeSpinRec(q.target % N, ts, i, idx[i]));
    snd('lever'); buzz(30);
  }
  function finishSpin(ts) {
    const res = evaluate(play.result.idx);
    if (res.amount > 0) {
      const ti = Math.min(0.12, 1.4 / res.amount);
      play.win = { amount: res.amount, given: 0, nextTick: ts + 0.25, ti, end: ts + 0.25 + res.amount * ti + 0.9, jackpot: !!res.three && res.id === 0 };
      play.state = 'win'; snd('win', res.amount >= 10); buzz(res.amount >= 10 ? [60, 50, 60, 50, 120] : [40, 40, 40]);
      const n = Math.min(12, 2 + Math.floor(res.amount / 3));
      for (let i = 0; i < n; i++) play.parts.push({ x: MX + 38, y: MY + 94, vx: (Math.random() - 0.5) * 90, vy: -70 - Math.random() * 70, gy: G + 2 + Math.random() * 12, born: ts + i * 0.05 });
    } else { play.state = 'lose'; play.until = ts + 1.0; snd('lose'); }
  }
  function afterRound(ts) {
    play.win = null;
    if (play.credits > 0 || play.coins.length > 0) play.state = 'idle';
    else { play.state = 'over'; play.until = ts + 2.0; }      // se acabó el dinero
  }

  function update(ts, dt) {
    if (mode !== 'play') return;
    const P = play;
    P.coins.forEach(c => {
      if (c.state === 'pop') {
        if (ts < c.t0) return;
        if (!c.dropped) { c.dropped = true; snd('coinDrop'); }
        const u = (ts - c.t0) / 0.3;
        if (u >= 1) { c.state = 'idle'; c.x = c.home.x; c.y = c.home.y; }
        else { c.x = c.home.x; c.y = c.home.y - 16 * Math.sin(Math.PI * u); }
      } else if (c.state === 'return') {
        const u = Math.min(1, (ts - c.t0) / 0.25), e = 1 - (1 - u) * (1 - u);
        c.x = c.fx + (c.home.x - c.fx) * e; c.y = c.fy + (c.home.y - c.fy) * e;
        if (u >= 1) c.state = 'idle';
      } else if (c.state === 'insert') {
        const u = ts - c.t0;
        if (u < 0.12) { const e = u / 0.12; c.x = c.fx + (SLOTX - c.fx) * e; c.y = c.fy + (SLOTY - c.fy) * e; }
        else if (u < 0.32) { c.x = SLOTX; c.y = SLOTY + 10 * ((u - 0.12) / 0.2); }
        else { c.dead = true; P.credits++; }
      }
    });
    P.coins = P.coins.filter(c => !c.dead);

    if (P.state === 'spinning') {
      if (P.stopped.some(s => !s) && ts >= P.nextTick) { snd('tick'); P.nextTick = ts + 0.07; }
      P.recs.forEach((q, i) => { if (!P.stopped[i] && ts >= q.finish) { P.stopped[i] = true; snd('reelStop'); } });
      if (ts >= lastFinish()) finishSpin(ts);
    } else if (P.state === 'win') {
      const w = P.win;
      while (w.given < w.amount && ts >= w.nextTick) {          // los créditos suben poco a poco
        P.credits++; w.given++; w.nextTick += w.ti;
        if (w.ti >= 0.04 || w.given % 4 === 0) snd('coinTick');
      }
      if (ts >= w.end) afterRound(ts);
    } else if (P.state === 'lose') { if (ts >= P.until) afterRound(ts); }
    else if (P.state === 'over') { if (ts >= P.until) endPlay(ts); }
    else if (P.state === 'closing') { if (ts >= lastFinish()) { mode = 'attract'; attractStart = ts; } }

    P.parts = P.parts.filter(p => ts - p.born < 3);               // monedas que saltan al ganar
    P.parts.forEach(p => {
      if (ts < p.born) return;
      p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > p.gy && p.vy > 0) { p.y = p.gy; p.vy *= -0.45; p.vx *= 0.7; }
    });
  }

  function headerFor(ts) {
    const P = play, on = (ts % 1.2) < 0.9;
    switch (P.state) {
      case 'idle': return P.credits > 0 ? { lines: ['TIRA DE LA', 'PALANCA'], color: '#ff6b5a', on } : { lines: ['ARRASTRA', 'MONEDAS'], color: '#ffd23a', on };
      case 'win': return P.win && P.win.jackpot ? { lines: ['JACKPOT', '777!!'], color: Math.floor(ts * 8) % 2 ? '#ff3030' : '#ffe27a', on: true }
                                                  : { lines: ['GANAS', '+' + (P.win ? P.win.amount : 0)], color: '#ffe27a', on: true };
      case 'lose': return { lines: ['SIN', 'PREMIO'], color: '#a05050', on: true };
      case 'over': return { lines: ['SIN', 'MONEDAS'], color: '#c01212', on: true };
      default: return null;
    }
  }

  function drawCoins(ts) {
    play.coins.forEach(c => {
      if (c.state === 'pop' && ts < c.t0) return;
      if (c.state === 'insert') {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SLOT_TOP); ctx.clip();
        drawSpriteC(COIN, c.x, c.y); ctx.restore(); return;
      }
      if (c.state === 'drag') { ctx.globalCompositeOperation = 'screen'; glow(ctx, R(c.x), R(c.y), 14, '255,210,90', 0.35); ctx.globalCompositeOperation = 'source-over'; }
      drawSpriteC(COIN, c.x, c.y);
      if (c.state === 'idle' && Math.floor(ts * 2.2 + c.home.x) % 5 === 0) r(c.x - 2, c.y - 2, 1, 1, '#fff6c0');
    });
    play.parts.forEach(p => {
      if (ts < p.born) return;
      const age = ts - p.born; ctx.globalAlpha = age > 2.5 ? Math.max(0, (3 - age) * 2) : 1;
      drawSpriteC(COIN, p.x, p.y); ctx.globalAlpha = 1;
    });
  }

  // ---------- ratón / táctil ----------
  function toLogical(e) {
    const rc = cv.getBoundingClientRect();
    return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
  }
  // Composición centrada: título, máquina y botones en columna, centrados en horizontal (el cuerpo de la
  // máquina, x = 160, en el centro exacto) y con el mismo espacio arriba, entre ellos y abajo.
  // Si para que todo respire la escena no llega a cubrir la pantalla, se funde con el negro por los bordes.
  const menuEl = document.getElementById('menu'), navEl = document.getElementById('menuButtons');
  const titleEl = document.getElementById('titleCanvas'), exitBtn = document.getElementById('slotExit');
  const MACH_TOP = MY - 1, MACH_H = G + 3 - MACH_TOP;          // de las bombillas a la sombra en el suelo
  const safe = document.createElement('div');                  // lee las zonas seguras (notch, barra de gestos)
  safe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)';
  document.body.appendChild(safe);
  function layoutScene() {
    const vw = innerWidth, vh = innerHeight, portrait = document.documentElement.dataset.layout === 'portrait';

        leverP: leverPos(tm), header: null, led: null, slotGlow: false,
        green: hoverGreen ? '#5fe070' : (ts % 5 < 0.3 ? '#7cff8a' : '#2f8f3a'),          // guiño discreto al secreto
        reel: i => ({ pos: reelPos(reels[i], tm), spd: (reelPos(reels[i], tm) - reelPos(reels[i], tm - 0.016)) / 0.016 })

    const rgb = winning ? '255,70,40' : '255,150,60';

              const dt = yy - y, db = y1 - yy;
              let col;
              if (dt === 0) col = [255, 96, 80];
              else if (dt === 1) col = [240, 42, 32];
              else if (db === 0) col = [74, 0, 0];
              else if (db === 1) col = [122, 5, 5];
              else if (db === 2 && ((x + yy) & 1)) col = [122, 5, 5];
              else if (x > 0 && !mask[yy * W + x - 1]) col = [226, 28, 22];
              else col = [200, 12, 12];
              set(yy * W + x, col[0], col[1], col[2], 255);
            }
            y = y1 + 1;
          }
        }
      });
      // gotas de sangre bajo la última línea
      const yb = PADT + lineH * (lines.length - 1) + 7 * TS, y0 = yb + 1;
      const drips = []; let lastX = -99;
      for (let x = PADX; x < W - PADX; x++) {
        if (mask[yb * W + x] && mask[yb * W + x + 1] && !mask[(yb + 1) * W + x] && !mask[(yb + 1) * W + x + 1] && x - lastX > 9 && hash(x * 1.7) > 0.5) {
          drips.push({ x, max: 9 + hash(x * 3.3) * 14, T: 5 + hash(x * 5.1) * 5, off: hash(x * 7.9) * 10 }); lastX = x;

    }

    function drawDrips(t) {
      const { drips, y0 } = S;
      const items = drips.map(d => {
        const p = ((t + d.off) / d.T) % 1; let len, drop = null;
        if (p < 0.7) len = 3 + (d.max - 3) * Math.pow(p / 0.7, 0.8);
        else { const q = (p - 0.7) / 0.3; len = 3 + (d.max - 3) * (1 - q * q); drop = { y: y0 + d.max + 2 + q * q * 16, a: 1 - q }; }

      });

      items.forEach(({ d, len, bulb, drop }) => {
        ctx.fillRect(d.x - 1, y0, 4, len + 1);
        if (bulb) ctx.fillRect(d.x - 2, y0 + len - 1, 6, 4);
        if (drop) { ctx.globalAlpha = drop.a; ctx.fillRect(d.x - 1, Math.round(drop.y) - 1, 4, 5); ctx.globalAlpha = 1; }

        ctx.fillStyle = '#ff6050'; ctx.fillRect(d.x, y0, 1, len);

        if (drop) { ctx.globalAlpha = drop.a; ctx.fillStyle = '#c80c0c'; ctx.fillRect(d.x, Math.round(drop.y), 2, 3); ctx.fillStyle = '#ff6050'; ctx.fillRect(d.x, Math.round(drop.y), 1, 2); ctx.globalAlpha = 1; }

    function layout(mode) {

  function applyLayout() {

  /* =====================================================================
     AUDIO: volumen general (master)

  const GameAudio = (() => {

      }

    function loadB64(key, b64) {

      coinTick() { blip(1600 + Math.random() * 400, 0.04, 'triangle', 0.05); },

      tick()     { blip(90, 0.025, 'square', 0.03); },

  const menu = $('menuButtons');

    g.fillRect(3, 3, 4, 4); g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(4, 4, 2, 2);

    g.fillStyle = 'rgba(232,224,208,0.85)';

    g.fillRect(2, 5, 6, 4); g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(4, 7, 2, 2);

  /* ---------- Nuevo juego ---------- */
  $('btnNew').addEventListener('click', () => {
    if ($('btnNew').hidden) return;

  $('hudPhone').addEventListener('click', () => openPhoneUI());

  function applyVolume(pct, audible) {

  $('volUp').addEventListener('click', () => applyVolume(+slider.value + 10, true));
  $('btnSettings').addEventListener('click', () => openSettings($('btnSettings')));
  $('settingsClose').addEventListener('click', closeSettings);
  const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;      // iPhone no lo permite: se oculta
  if (!fsOK) $('fsRow').style.display = 'none';

  $('btnExit').addEventListener('click', () => openOverlay($('confirm'), $('confirmNo'), $('btnExit')));
  $('confirmNo').addEventListener('click', closeOverlay);

    $('confirm').classList.remove('open'); current = null;

  });

})();

<script>
(() => {
  'use strict';
  /* =====================================================================
     INTRODUCCIÓN: una sala vieja y vacía. El espejo refleja la luz y no deja ver nada.
     Entra desde negro, suena el viento y una voz dice la fecha mientras aparece letra a letra.
     ===================================================================== */
  const W = 320, H = 180;
  const cv = document.getElementById('introCanvas');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const ease = u => u * u * (3 - 2 * u);

  const CEIL = 8, RAIL = 96, BASE = 128, FLOOR = 134;
  // geometría del espejo (la usa el dibujo estático y el reflejo animado)
  const MX0 = 92, MY0 = 18, MW = 124, MH = 48;
  const GX = MX0 + 6, GY = MY0 + 6, GW = MW - 12, GH = MH - 12;     // cristal
  let bg = null, bgBare = null, vig = null;

  function build() {
    bg = document.createElement('canvas'); bg.width = W; bg.height = H;
    const b = bg.getContext('2d');

    const Pt = (x, y, c, a) => R(x, y, 1, 1, c, a);
    const L = (x0, y0, x1, y1, c, a) => { const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) || 1; for (let i = 0; i <= n; i++) Pt(Math.round(x0 + dx * i / n), Math.round(y0 + dy * i / n), c, a); };
    const disc = (cx, cy, r, c, a) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (Math.hypot(x, y) <= r + 0.3) Pt(cx + x, cy + y, c, a); };
    const ring = (cx, cy, r, c, a) => { for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) if (Math.abs(Math.hypot(x, y) - r) < 0.6) Pt(cx + x, cy + y, c, a); };
    const dith = (x, y, w, h, c, ph, a) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (((i + j + (ph || 0)) & 1) === 0) Pt(x + i, y + j, c, a); };

    const blotch = (cx, cy, rx, ry, c, a, seed) => { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) { const d = (x * x) / (rx * rx) + (y * y) / (ry * ry) + (hash(x * 3.1 + y * 5.7 + seed) - 0.5) * 0.5; if (d < 1) Pt(cx + x, cy + y, c, a * (1 - d * 0.6)); } };

    // ---------- techo y moldura ----------
    R(0, 0, W, CEIL, '#211a12'); R(0, 0, W, 2, '#17110b'); R(0, 5, W, 1, '#4a3d2b'); R(0, 6, W, 1, '#2d2418'); R(0, 7, W, 1, '#120d08');

    // ---------- papel pintado (franjas + motivo damasco) ----------
    for (let x = 0; x < W; x++) R(x, CEIL, 1, RAIL - CEIL, (Math.floor(x / 12) % 2) ? '#85733f' : '#8f7c49');
    for (let s = 1; s * 12 < W; s++) R(s * 12, CEIL, 1, RAIL - CEIL, '#5d4e2a', 0.3);
    const MOT = ['..X..', '.XXX.', '..X..', 'X.X.X', '.XXX.', '..X..', '..X..'];
    for (let m = 0; m < 6; m++) for (let k = 0; k < 14; k++) {
      const cx = 6 + k * 24 + (m % 2 ? 12 : 0), cy = 15 + m * 14;
      MOT.forEach((row, j) => { for (let i = 0; i < 5; i++) if (row[i] === 'X') Pt(cx - 2 + i, cy - 3 + j, '#6b5a33'); });
    }
    // envejecido: oscurece arriba, goteras, moho, manchas, desconchones y grietas
    for (let y = CEIL; y < CEIL + 36; y += 3) R(0, y, W, 3, '#000', 0.42 * (1 - (y - CEIL) / 36));
    [14, 62, 118, 175, 214, 258, 300].forEach((sx, i) => {
      const len = 22 + Math.floor(hash(i * 7) * 40), w0 = 1 + Math.floor(hash(i * 3) * 3);
      for (let y = 0; y < len; y++) { const wv = w0 + (hash(y * 1.3 + i) > 0.8 ? 1 : 0); R(sx - wv, CEIL + y, wv * 2 + 1, 1, '#3a2a10', 0.28 * (1 - y / len) + 0.06); }

    const black = 1 - ease(clamp(t / FADE, 0, 1));
    if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }

    raf = requestAnimationFrame(frame);
  }
  window.PDIntro = { start, stop, skipLine };
})();
</script>
