# phanteru's daemon: https://tontunaland.online/phanterusgame/
# Bloque añadido dentro del server { listen 443 ssl; server_name tontunaland.online ...; }
# de /etc/nginx/sites-available/tontunaland.conf (junto a /katsu/ y /cartaparaalba/).
# Los archivos los copia scripts/deploy.mjs en /opt/phanterusgame.

    # phanteru's daemon (juego)
    location /phanterusgame/ {
        alias /opt/phanterusgame/;
        index index.html;
        gzip_static on;                              # sirve index.html.gz ya comprimido por el build
        add_header Cache-Control "no-cache" always;  # cada visita comprueba si hay versión nueva
        try_files $uri $uri/ =404;
    }
    location = /phanterusgame {
        return 301 /phanterusgame/;
    }
